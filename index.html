<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏空间</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="container">
    <nav class="game-nav" id="gameNav">
        <button class="nav-btn active" data-game="tetris">俄罗斯方块</button>
        <button class="nav-btn" data-game="sudoku">数独</button>
        <button class="nav-btn" data-game="nonogram">数织</button>
        <button class="nav-btn" data-game="chess">象棋</button>
        <button class="nav-btn" data-game="klotski">华容道</button>
        <button class="nav-btn" data-game="minesweeper">扫雷</button>
        <button class="nav-btn" data-game="lightsout">灭灯</button>
        <button class="nav-btn" data-game="graphcoloring">图着色</button>
        <button class="nav-btn" data-game="zebra">斑马谜题</button>
    </nav>

    <main class="game-content">
        <iframe id="gameFrame" src="games/tetris.html" title="游戏"></iframe>
    </main>
</div>

<script src="js/bridge.js"></script>
<script>
(function () {
    const frame = document.getElementById('gameFrame');
    const buttons = document.querySelectorAll('.nav-btn');
    let currentGame = 'tetris';

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            const game = btn.dataset.game;
            if (game === currentGame) return;

            // 通知旧 iframe 暂停
            GameBridge.notifyPause(frame);

            // 更新激活状态
            buttons.forEach(b => b.classList.toggle('active', b === btn));

            // 切换 iframe 内容
            frame.src = `games/${game}.html`;
            currentGame = game;
        });
    });
})();
</script>
</body>
</html>
