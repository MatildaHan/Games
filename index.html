<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏空间 - 生活与工具</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="container">
    <!-- 游戏切换导航 -->
    <nav class="game-nav" id="gameNav">
        <button class="nav-btn active" data-game="tetris">俄罗斯方块</button>
        <button class="nav-btn" data-game="sudoku">数独</button>
        <button class="nav-btn" data-game="nonogram">数织</button>
        <button class="nav-btn" data-game="chess">象棋</button>
        <button class="nav-btn" data-game="klotski">华容道</button>
        <button class="nav-btn" data-game="minesweeper">扫雷</button>
        <button class="nav-btn" data-game="lightsout">灭灯</button>
        <button class="nav-btn" data-game="graphcoloring">图着色</button>
        <button class="nav-btn" data-game="zebra">斑马谜题</button>
    </nav>

    <!-- 游戏容器 -->
    <main class="game-content">
        <iframe id="gameFrame" src="games/tetris.html" frameborder="0" width="100%" height="100%"></iframe>
    </main>
</div>

<script>
    // ==========================================
    // 游戏切换路由（内联，避免外部 JS 加载失败）
    // ==========================================
    (function () {
        const gameFrame = document.getElementById('gameFrame');
        const navButtons = document.querySelectorAll('.nav-btn');

        console.log('路由初始化：找到', navButtons.length, '个按钮');

        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const game = btn.dataset.game;
                console.log('切换到游戏：', game);

                // 更新按钮激活状态
                navButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 切换 iframe 内容
                if (gameFrame) {
                    gameFrame.src = `games/${game}.html`;
                }
            });
        });
    })();
</script>
</body>
</html>
