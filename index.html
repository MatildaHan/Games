<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>游戏空间</title>
<link rel="stylesheet" href="css/common.css">
<style>
/* ============================================================
   移动端：单行顶部栏 + 全屏游戏选择弹窗
   ============================================================ */

/* 单行顶部栏：只在手机显示 */
.mobile-topbar {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 10px 12px;
    flex-shrink: 0;
}
.mobile-topbar .current-name {
    flex: 1;
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.mobile-topbar .switch-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--primary);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    min-height: 36px;
    flex-shrink: 0;
}
.mobile-topbar .switch-btn svg {
    width: 14px;
    height: 14px;
    display: block;
}

/* 全屏选择弹窗 */
.game-picker {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.92);
    z-index: 300;
    display: none;
    flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    animation: pickerFadeIn 0.15s ease;
}
.game-picker.show { display: flex; }
@keyframes pickerFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
.game-picker .picker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-shrink: 0;
}
.game-picker .picker-title {
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
}
.game-picker .picker-close {
    background: transparent;
    color: var(--text-sub);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    min-height: 40px;
}
.game-picker .picker-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    overflow-y: auto;
    flex: 1;
    align-content: start;
}
.game-picker .picker-item {
    background: rgba(30, 41, 59, 0.75);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 24px 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
}
.game-picker .picker-item:active {
    transform: scale(0.97);
}
.game-picker .picker-item.active {
    background: var(--primary);
    color: #000;
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
}

/* 桌面/平板：隐藏单行栏，显示 grid 导航 */
@media (min-width: 768px) {
    .mobile-topbar { display: none !important; }
    .game-picker { display: none !important; }
}

/* 手机：隐藏 grid 导航，显示单行栏 */
@media (max-width: 767px) {
    .game-nav { display: none; }
    .mobile-topbar { display: flex; }
}
</style>
</head>
<body>
<div class="container">
    <!-- 桌面/平板：完整 grid 导航 -->
    <nav class="game-nav" id="gameNav" aria-label="游戏选择">
        <button class="nav-btn" data-game="tetris" aria-pressed="false">俄罗斯方块</button>
        <button class="nav-btn" data-game="sudoku" aria-pressed="false">数独</button>
        <button class="nav-btn" data-game="nonogram" aria-pressed="false">数织</button>
        <button class="nav-btn" data-game="chess" aria-pressed="false">象棋</button>
        <button class="nav-btn" data-game="gomoku" aria-pressed="false">五子棋</button>
        <button class="nav-btn" data-game="klotski" aria-pressed="false">华容道</button>
        <button class="nav-btn" data-game="minesweeper" aria-pressed="false">扫雷</button>
        <button class="nav-btn" data-game="lightsout" aria-pressed="false">灭灯</button>
        <button class="nav-btn" data-game="graphcoloring" aria-pressed="false">图着色</button>
        <button class="nav-btn" data-game="zebra" aria-pressed="false">斑马谜题</button>
    </nav>

    <!-- 手机：单行栏 -->
    <div class="mobile-topbar" id="mobileTopbar">
        <span class="current-name" id="currentGameName">俄罗斯方块</span>
        <button class="switch-btn" id="btnPicker" aria-label="切换游戏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6"/>
            </svg>
            切换
        </button>
    </div>

    <main class="game-content">
        <iframe id="gameFrame" title="游戏" allow="fullscreen"></iframe>
        <div id="loading" class="loading-overlay">加载中…</div>
        <div id="errorOverlay" class="error-overlay" hidden>
            <div class="error-box">
                <h2>加载失败</h2>
                <p id="errorMsg">无法加载游戏页面</p>
                <button class="btn" id="btnRetry">重试</button>
            </div>
        </div>
    </main>
</div>

<!-- 全屏游戏选择弹窗（手机用） -->
<div class="game-picker" id="gamePicker" aria-hidden="true">
    <div class="picker-header">
        <div class="picker-title">选择游戏</div>
        <button class="picker-close" id="btnPickerClose">关闭</button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
</div>

<style>
/* 加载/错误覆盖层 */
.loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.6);
    color: var(--text-sub);
    font-size: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 5;
}
.loading-overlay.show { opacity: 1; }

.error-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.85);
    z-index: 6;
}
.error-overlay[hidden] { display: none; }
.error-box {
    background: rgba(30, 41, 59, 0.98);
    padding: 24px 32px;
    border-radius: 16px;
    border: 1px solid var(--border);
    text-align: center;
    max-width: 90%;
}
.error-box h2 { color: var(--danger); font-size: 18px; margin-bottom: 8px; }
.error-box p { color: var(--text-sub); font-size: 13px; margin-bottom: 16px; }
</style>

<script src="js/bridge.js"></script>
<script>
(function () {
    'use strict';

    // 游戏元数据：与按钮 data-game 对应
    const GAMES = [
        { id: 'tetris',        name: '俄罗斯方块' },
        { id: 'sudoku',        name: '数独' },
        { id: 'nonogram',      name: '数织' },
        { id: 'chess',         name: '象棋' },
        { id: 'gomoku',        name: '五子棋' },
        { id: 'klotski',       name: '华容道' },
        { id: 'minesweeper',   name: '扫雷' },
        { id: 'lightsout',     name: '灭灯' },
        { id: 'graphcoloring', name: '图着色' },
        { id: 'zebra',         name: '斑马谜题' }
    ];
    const STORAGE_KEY = 'gameHub.lastGame';

    const frame = document.getElementById('gameFrame');
    const buttons = document.querySelectorAll('.nav-btn');
    const loadingEl = document.getElementById('loading');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorMsg = document.getElementById('errorMsg');
    const btnRetry = document.getElementById('btnRetry');

    const mobileTopbar = document.getElementById('mobileTopbar');
    const currentGameName = document.getElementById('currentGameName');
    const btnPicker = document.getElementById('btnPicker');
    const btnPickerClose = document.getElementById('btnPickerClose');
    const gamePicker = document.getElementById('gamePicker');
    const pickerGrid = document.getElementById('pickerGrid');

    let currentGame = null;
    let loadingTimer = null;

    // ============================================================
    // 构建弹窗里的游戏列表
    // ============================================================
    function buildPicker() {
        pickerGrid.innerHTML = '';
        GAMES.forEach(g => {
            const btn = document.createElement('button');
            btn.className = 'picker-item';
            btn.dataset.game = g.id;
            btn.textContent = g.name;
            btn.addEventListener('click', () => {
                closePicker();
                switchGame(g.id);
            });
            pickerGrid.appendChild(btn);
        });
        updatePickerActive();
    }

    function updatePickerActive() {
        pickerGrid.querySelectorAll('.picker-item').forEach(item => {
            item.classList.toggle('active', item.dataset.game === currentGame);
        });
    }

    function openPicker() {
        gamePicker.classList.add('show');
        gamePicker.setAttribute('aria-hidden', 'false');
        updatePickerActive();
    }
    function closePicker() {
        gamePicker.classList.remove('show');
        gamePicker.setAttribute('aria-hidden', 'true');
    }

    // ============================================================
    // 初始游戏
    // ============================================================
    function pickInitialGame() {
        const hash = (location.hash || '').replace(/^#/, '');
        if (GAMES.some(g => g.id === hash)) return hash;
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (GAMES.some(g => g.id === saved)) return saved;
        } catch (e) {}
        return 'tetris';
    }

    // ============================================================
    // 加载态
    // ============================================================
    function showLoading() {
        loadingEl.classList.add('show');
        clearTimeout(loadingTimer);
        loadingTimer = setTimeout(() => {
            if (loadingEl.classList.contains('show')) {
                showError('加载超时，请检查网络或重试');
            }
        }, 12000);
    }
    function hideLoading() {
        loadingEl.classList.remove('show');
        clearTimeout(loadingTimer);
    }
    function showError(msg) {
        errorMsg.textContent = msg;
        errorOverlay.hidden = false;
        hideLoading();
    }
    function hideError() {
        errorOverlay.hidden = true;
    }

    // ============================================================
    // 切换游戏
    // ============================================================
    function switchGame(game, { updateHash = true } = {}) {
        if (game === currentGame) return;
        if (!GAMES.some(g => g.id === game)) game = 'tetris';

        GameBridge.notifyPause(frame);

        // 桌面导航按钮状态
        buttons.forEach(b => {
            const active = b.dataset.game === game;
            b.classList.toggle('active', active);
            b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });

        // 手机顶部栏 & 弹窗状态
        const meta = GAMES.find(g => g.id === game);
        currentGameName.textContent = meta ? meta.name : game;
        updatePickerActive();

        showLoading();
        hideError();
        frame.src = `games/${game}.html`;

        currentGame = game;
        try { localStorage.setItem(STORAGE_KEY, game); } catch (e) {}
        if (updateHash && location.hash !== '#' + game) {
            history.replaceState(null, '', '#' + game);
        }
    }

    // ============================================================
    // 事件
    // ============================================================
    frame.addEventListener('load', () => {
        hideLoading();
        try { frame.contentWindow.focus(); } catch (e) {}
    });
    frame.addEventListener('error', () => {
        showError('无法加载游戏页面');
    });

    buttons.forEach(btn => {
        btn.addEventListener('click', () => switchGame(btn.dataset.game));
    });

    btnPicker.addEventListener('click', openPicker);
    btnPickerClose.addEventListener('click', closePicker);
    gamePicker.addEventListener('click', (e) => {
        // 点击弹窗空白区域关闭
        if (e.target === gamePicker) closePicker();
    });

    window.addEventListener('hashchange', () => {
        const hash = (location.hash || '').replace(/^#/, '');
        if (GAMES.some(g => g.id === hash) && hash !== currentGame) {
            switchGame(hash, { updateHash: false });
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) GameBridge.notifyPause(frame);
    });

    btnRetry.addEventListener('click', () => {
        hideError();
        const g = currentGame;
        currentGame = null;
        switchGame(g);
    });

    // ESC 关闭弹窗
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && gamePicker.classList.contains('show')) {
            closePicker();
        }
    });

    // ============================================================
    // 启动
    // ============================================================
    buildPicker();
    const initial = pickInitialGame();
    // 桌面按钮状态
    buttons.forEach(b => {
        const active = b.dataset.game === initial;
        b.classList.toggle('active', active);
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    // 手机顶部栏文案
    const initMeta = GAMES.find(g => g.id === initial);
    currentGameName.textContent = initMeta ? initMeta.name : initial;
    currentGame = null;
    switchGame(initial, { updateHash: false });
    if (location.hash !== '#' + initial) {
        history.replaceState(null, '', '#' + initial);
    }
})();
</script>
</body>
</html>
