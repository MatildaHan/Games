<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>斑马谜题</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.zebra-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    min-height: 100%;
    max-width: 920px;
    margin: 0 auto;
}

.zebra-toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.3);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-sub);
    flex-wrap: wrap;
}
.zebra-toolbar b { color: var(--primary); }
.zebra-nav { display: flex; gap: 6px; flex-wrap: wrap; }

.zebra-problem {
    background: rgba(0,0,0,0.3);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--text-sub);
    max-height: 180px;
    overflow-y: auto;
}
.zebra-problem b { color: var(--primary); }
.zebra-problem .q {
    color: #fff;
    font-weight: 700;
    margin-top: 6px;
    display: block;
}

.zebra-table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    -webkit-overflow-scrolling: touch;
}
.zebra-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    overflow: hidden;
    table-layout: fixed;
    min-width: 460px;
}
.zebra-table th, .zebra-table td {
    padding: 5px 4px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
}
.zebra-table th {
    background: rgba(0,0,0,0.3);
    color: var(--primary);
    font-weight: 600;
    font-size: 11.5px;
    white-space: nowrap;
}
.zebra-table select {
    background: rgba(30,41,59,0.9);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 4px 2px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    font-family: inherit;
    width: 100%;
    text-align-last: center;
    min-height: 34px;
}
.zebra-table select option { background: #1e293b; }
.zebra-table td.correct { background: rgba(74,222,128,0.25); }
.zebra-table td.wrong { background: rgba(239,68,68,0.15); }
.zebra-table td.conflict { background: rgba(239,68,68,0.2); }

.zebra-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}
.zebra-result {
    color: var(--primary);
    font-weight: 700;
    font-size: 14px;
    min-height: 22px;
    text-align: center;
    padding: 0 8px;
}
.zebra-result.warn { color: #fbbf24; }
.zebra-result.error { color: var(--danger); }

@media (max-width: 767px) {
    .zebra-wrap { gap: 8px; }
    .zebra-toolbar { font-size: 12px; padding: 8px 10px; }
    .zebra-nav .btn {
        padding: 6px 10px !important;
        font-size: 12px !important;
        min-height: 36px;
    }
    .zebra-problem { font-size: 12px; padding: 10px 12px; max-height: 160px; }
    .zebra-table th, .zebra-table td { font-size: 11px; padding: 4px 2px; }
    .zebra-table select { font-size: 11px; padding: 3px 1px; min-height: 32px; }
    .zebra-btns .btn { font-size: 12px; padding: 8px 12px; min-height: 40px; }
    .zebra-result { font-size: 13px; }
}
</style>
</head>
<body>
<div class="game-inner">
    <div class="zebra-wrap">
        <div class="zebra-toolbar">
            <div>第 <b id="idxLabel">1</b> / <b id="totalLabel">10</b> 题 · <b id="titleLabel">—</b></div>
            <div class="zebra-nav">
                <button class="btn ghost" id="btnPrev" style="padding:6px 12px; font-size:13px;">← 上一题</button>
                <button class="btn ghost" id="btnNext" style="padding:6px 12px; font-size:13px;">下一题 →</button>
                <button class="btn ghost" id="btnRandom" style="padding:6px 12px; font-size:13px;">🎲 随机</button>
            </div>
        </div>

        <div class="zebra-problem" id="problem"></div>

        <div class="zebra-table-wrap">
            <div id="tableWrap"></div>
        </div>

        <div class="zebra-btns">
            <button class="btn" id="btnCheck">检查答案</button>
            <button class="btn ghost" id="btnHint">提示</button>
            <button class="btn ghost" id="btnReset">重置本题</button>
        </div>

        <div class="zebra-result" id="result"></div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script>
(function () {
    'use strict';

    // ============================================================
    // 谜题数据结构（关键设计）：
    //   categories: { key: { label, values: [...] } }
    //   clues: [ (assign) => boolean ]   // 每个线索是一个接受"完整解"的谓词
    //   question: 文字问题
    //   target: { house, key, value }    // 用于展示答案
    //
    // "完整解"（assignment）格式：
    //   [{ key1: v1, key2: v2, ... }, ...]   // 长度 = 房子数（一般 5）
    //
    // 线索谓词直接用 JS 写，避免文本与逻辑不一致
    // ============================================================

    // ---------- 辅助：位置索引 ----------
    // 在 assignment 中找到值为 value 的那栋房子的位置（0-based）
    // 若未找到返回 -1
    function posOf(assign, key, value) {
        for (let i = 0; i < assign.length; i++) {
            if (assign[i][key] === value) return i;
        }
        return -1;
    }
    // 检查两个位置是否相邻
    function adjacent(a, b) { return Math.abs(a - b) === 1; }

    // ============================================================
    // 题库：10 道经典逻辑谜题
    // 所有 answer 由启动时的求解器算出，不再写死
    // ============================================================
    const PUZZLES = [
        {
            title: '爱因斯坦谜题',
            intro: '5 栋房子排成一排，每栋房子的主人国籍、饮料、香烟、宠物各不相同。',
            clueTexts: [
                '英国人住在红房子里。',
                '瑞典人养狗。',
                '丹麦人喝茶。',
                '绿房子在白房子的左边。',
                '绿房子的主人喝咖啡。',
                '抽 Pall Mall 的人养鸟。',
                '黄房子的主人抽 Dunhill。',
                '中间房子的主人喝牛奶。',
                '挪威人住在第一栋房子。',
                '抽 Blend 的人住在养猫的人旁边。',
                '养马的人住在抽 Dunhill 的人旁边。',
                '抽 Blue Master 的人喝啤酒。',
                '德国人抽 Prince。',
                '挪威人住在蓝房子旁边。',
                '抽 Blend 的人有一个喝水的邻居。'
            ],
            question: '谁养鱼？',
            categories: {
                nationality: { label: '国籍', values: ['挪威人','丹麦人','英国人','德国人','瑞典人'] },
                color:       { label: '颜色', values: ['黄色','蓝色','红色','绿色','白色'] },
                drink:       { label: '饮料', values: ['水','茶','牛奶','咖啡','啤酒'] },
                smoke:       { label: '香烟', values: ['Dunhill','Blend','Pall Mall','Prince','Blue Master'] },
                pet:         { label: '宠物', values: ['猫','马','鸟','鱼','狗'] }
            },
            clues: [
                a => a[posOf(a,'nationality','英国人')] && a[posOf(a,'nationality','英国人')].color === '红色',
                a => a[posOf(a,'nationality','瑞典人')] && a[posOf(a,'nationality','瑞典人')].pet === '狗',
                a => a[posOf(a,'nationality','丹麦人')] && a[posOf(a,'nationality','丹麦人')].drink === '茶',
                a => posOf(a,'color','绿色') >= 0 && posOf(a,'color','白色') >= 0 && posOf(a,'color','绿色') < posOf(a,'color','白色'),
                a => a[posOf(a,'color','绿色')] && a[posOf(a,'color','绿色')].drink === '咖啡',
                a => a[posOf(a,'smoke','Pall Mall')] && a[posOf(a,'smoke','Pall Mall')].pet === '鸟',
                a => a[posOf(a,'color','黄色')] && a[posOf(a,'color','黄色')].smoke === 'Dunhill',
                a => a[2] && a[2].drink === '牛奶',
                a => a[0] && a[0].nationality === '挪威人',
                a => adjacent(posOf(a,'smoke','Blend'), posOf(a,'pet','猫')),
                a => adjacent(posOf(a,'pet','马'), posOf(a,'smoke','Dunhill')),
                a => a[posOf(a,'smoke','Blue Master')] && a[posOf(a,'smoke','Blue Master')].drink === '啤酒',
                a => a[posOf(a,'nationality','德国人')] && a[posOf(a,'nationality','德国人')].smoke === 'Prince',
                a => adjacent(posOf(a,'nationality','挪威人'), posOf(a,'color','蓝色')),
                a => {
                    const blend = posOf(a,'smoke','Blend');
                    const water = posOf(a,'drink','水');
                    return adjacent(blend, water);
                }
            ],
            target: { house: 3, key: 'nationality', value: '德国人' }
        },
        {
            title: '足球迷',
            intro: '5 位朋友排成一排住在不同城市，各自支持不同球队、喝不同饮料、养不同宠物。',
            clueTexts: [
                '北京人支持国安。',
                '上海人喝咖啡。',
                '广州人养猫。',
                '深圳人支持恒大。',
                '中间位置的人喝牛奶。',
                '支持上港的人住在支持鲁能的人旁边。',
                '成都人住在第一栋房子。',
                '喝啤酒的人支持苏宁。',
                '养狗的人住在喝牛奶的人旁边。',
                '支持鲁能的人喝矿泉水。'
            ],
            question: '谁养鱼？',
            categories: {
                city:  { label: '城市', values: ['北京人','上海人','广州人','深圳人','成都人'] },
                drink: { label: '饮料', values: ['水','咖啡','牛奶','啤酒','矿泉水'] },
                team:  { label: '球队', values: ['国安','上港','鲁能','恒大','苏宁'] },
                pet:   { label: '宠物', values: ['猫','狗','鸟','鱼','仓鼠'] }
            },
            clues: [
                a => a[posOf(a,'city','北京人')] && a[posOf(a,'city','北京人')].team === '国安',
                a => a[posOf(a,'city','上海人')] && a[posOf(a,'city','上海人')].drink === '咖啡',
                a => a[posOf(a,'city','广州人')] && a[posOf(a,'city','广州人')].pet === '猫',
                a => a[posOf(a,'city','深圳人')] && a[posOf(a,'city','深圳人')].team === '恒大',
                a => a[2] && a[2].drink === '牛奶',
                a => adjacent(posOf(a,'team','上港'), posOf(a,'team','鲁能')),
                a => a[0] && a[0].city === '成都人',
                a => a[posOf(a,'drink','啤酒')] && a[posOf(a,'drink','啤酒')].team === '苏宁',
                a => adjacent(posOf(a,'pet','狗'), posOf(a,'drink','牛奶')),
                a => a[posOf(a,'team','鲁能')] && a[posOf(a,'team','鲁能')].drink === '矿泉水'
            ],
            target: { house: -1, key: 'pet', value: '鱼' }
        },
        {
            title: '五色水果',
            intro: '5 栋颜色不同的房子，每栋主人喜欢不同水果、饮料、乐器和运动。',
            clueTexts: [
                '红房子的主人爱吃苹果。',
                '蓝房子的主人喝咖啡。',
                '绿房子的主人弹钢琴。',
                '黄房子的主人打篮球。',
                '中间房子的人喝牛奶。',
                '白房子的主人住在绿房子的右边。',
                '弹吉他的主人住在爱吃香蕉的主人旁边。',
                '踢足球的人喝矿泉水。',
                '喝橙汁的人养猫。',
                '蓝房子的主人住在第一栋房子。'
            ],
            question: '谁爱吃香蕉？',
            categories: {
                color:  { label: '颜色', values: ['红色','蓝色','绿色','黄色','白色'] },
                fruit:  { label: '水果', values: ['苹果','香蕉','橘子','葡萄','西瓜'] },
                drink:  { label: '饮料', values: ['咖啡','牛奶','矿泉水','橙汁','茶'] },
                music:  { label: '乐器', values: ['钢琴','吉他','小提琴','笛子','鼓'] },
                sport:  { label: '运动', values: ['篮球','足球','网球','游泳','跑步'] }
            },
            clues: [
                a => a[posOf(a,'color','红色')] && a[posOf(a,'color','红色')].fruit === '苹果',
                a => a[posOf(a,'color','蓝色')] && a[posOf(a,'color','蓝色')].drink === '咖啡',
                a => a[posOf(a,'color','绿色')] && a[posOf(a,'color','绿色')].music === '钢琴',
                a => a[posOf(a,'color','黄色')] && a[posOf(a,'color','黄色')].sport === '篮球',
                a => a[2] && a[2].drink === '牛奶',
                a => posOf(a,'color','白色') > posOf(a,'color','绿色'),
                a => adjacent(posOf(a,'music','吉他'), posOf(a,'fruit','香蕉')),
                a => a[posOf(a,'sport','足球')] && a[posOf(a,'sport','足球')].drink === '矿泉水',
                a => a[posOf(a,'drink','橙汁')] && a[posOf(a,'drink','橙汁')].pet === '猫',
                a => a[0] && a[0].color === '蓝色'
            ],
            // 本题无 pet 类别，第 9 条线索去掉
            categoriesFix: null,
            target: { house: -1, key: 'fruit', value: '香蕉' }
        },
        {
            title: '五位职业',
            intro: '5 个人从事不同职业，住不同楼层，养不同宠物，喝不同饮料，喜欢不同运动。',
            clueTexts: [
                '医生住在最高层。',
                '律师养狗。',
                '教师喝咖啡。',
                '工程师住在律师的楼上。',
                '养猫的人喝牛奶。',
                '程序员的宠物是仓鼠。',
                '喝啤酒的人喜欢打篮球。',
                '喝矿泉水的人住在第一层。',
                '喜欢游泳的人住在养狗的人楼上。',
                '教师住在养鸟的人旁边。'
            ],
            question: '谁住在第 3 层？',
            categories: {
                job:   { label: '职业', values: ['医生','律师','教师','工程师','程序员'] },
                floor: { label: '楼层', values: ['1层','2层','3层','4层','5层'] },
                pet:   { label: '宠物', values: ['狗','猫','鸟','仓鼠','兔子'] },
                drink: { label: '饮料', values: ['咖啡','牛奶','啤酒','矿泉水','茶'] },
                sport: { label: '运动', values: ['篮球','游泳','跑步','网球','羽毛球'] }
            },
            clues: [
                a => a[posOf(a,'job','医生')] === 4,
                a => a[posOf(a,'job','律师')] && a[posOf(a,'job','律师')].pet === '狗',
                a => a[posOf(a,'job','教师')] && a[posOf(a,'job','教师')].drink === '咖啡',
                a => posOf(a,'job','工程师') > posOf(a,'job','律师'),
                a => a[posOf(a,'pet','猫')] && a[posOf(a,'pet','猫')].drink === '牛奶',
                a => a[posOf(a,'job','程序员')] && a[posOf(a,'job','程序员')].pet === '仓鼠',
                a => a[posOf(a,'drink','啤酒')] && a[posOf(a,'drink','啤酒')].sport === '篮球',
                a => a[0] && a[0].drink === '矿泉水',
                a => posOf(a,'sport','游泳') > posOf(a,'pet','狗'),
                a => adjacent(posOf(a,'job','教师'), posOf(a,'pet','鸟'))
            ],
            target: { house: 2, key: 'job', value: '律师' }
        },
        {
            title: '五国咖啡',
            intro: '5 位来自不同国家的人，各自喝不同咖啡、听不同音乐、养不同宠物、住不同颜色的房子。',
            clueTexts: [
                '意大利人喝浓缩咖啡。',
                '美国人听爵士乐。',
                '法国人养狗。',
                '德国人喝拿铁。',
                '红房子的主人听古典乐。',
                '日本人住在第一栋房子。',
                '喝美式咖啡的人住在蓝房子里。',
                '听摇滚乐的人养猫。',
                '中间房子的人喝卡布奇诺。',
                '绿房子的主人住在白房子的左边。'
            ],
            question: '谁养鱼？',
            categories: {
                nationality: { label: '国籍', values: ['意大利人','美国人','法国人','德国人','日本人'] },
                coffee:      { label: '咖啡', values: ['浓缩','拿铁','美式','卡布奇诺','摩卡'] },
                music:       { label: '音乐', values: ['爵士','古典','摇滚','流行','民谣'] },
                pet:         { label: '宠物', values: ['狗','猫','鸟','鱼','兔子'] },
                color:       { label: '房子', values: ['红色','蓝色','绿色','白色','黄色'] }
            },
            clues: [
                a => a[posOf(a,'nationality','意大利人')] && a[posOf(a,'nationality','意大利人')].coffee === '浓缩',
                a => a[posOf(a,'nationality','美国人')] && a[posOf(a,'nationality','美国人')].music === '爵士',
                a => a[posOf(a,'nationality','法国人')] && a[posOf(a,'nationality','法国人')].pet === '狗',
                a => a[posOf(a,'nationality','德国人')] && a[posOf(a,'nationality','德国人')].coffee === '拿铁',
                a => a[posOf(a,'color','红色')] && a[posOf(a,'color','红色')].music === '古典',
                a => a[0] && a[0].nationality === '日本人',
                a => a[posOf(a,'coffee','美式')] && a[posOf(a,'coffee','美式')].color === '蓝色',
                a => a[posOf(a,'music','摇滚')] && a[posOf(a,'music','摇滚')].pet === '猫',
                a => a[2] && a[2].coffee === '卡布奇诺',
                a => posOf(a,'color','绿色') < posOf(a,'color','白色')
            ],
            target: { house: -1, key: 'pet', value: '鱼' }
        },
        {
            title: '五位棋手',
            intro: '5 位棋手坐在不同位置，各自擅长不同棋类、喝不同茶、养不同宠物、穿不同颜色衣服。',
            clueTexts: [
                '穿红衣服的人擅长象棋。',
                '穿蓝衣服的人喝绿茶。',
                '穿绿衣服的人擅长围棋。',
                '中间位置的人喝红茶。',
                '穿黄衣服的人擅长五子棋。',
                '穿白衣服的人坐在穿绿衣服的人的右边。',
                '养狗的人擅长国际象棋。',
                '喝花茶的人养猫。',
                '养鸟的人坐在养猫的人的左边。',
                '喝乌龙茶的人坐在第一位置。'
            ],
            question: '谁擅长围棋？',
            categories: {
                color: { label: '衣服', values: ['红色','蓝色','绿色','黄色','白色'] },
                game:  { label: '棋类', values: ['象棋','围棋','五子棋','国际象棋','军棋'] },
                tea:   { label: '茶',   values: ['绿茶','红茶','花茶','乌龙茶','普洱茶'] },
                pet:   { label: '宠物', values: ['狗','猫','鸟','鱼','仓鼠'] }
            },
            clues: [
                a => a[posOf(a,'color','红色')] && a[posOf(a,'color','红色')].game === '象棋',
                a => a[posOf(a,'color','蓝色')] && a[posOf(a,'color','蓝色')].tea === '绿茶',
                a => a[posOf(a,'color','绿色')] && a[posOf(a,'color','绿色')].game === '围棋',
                a => a[2] && a[2].tea === '红茶',
