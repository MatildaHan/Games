<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>斑马谜题</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.zebra-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    min-height: 100%;
    max-width: 920px;
    margin: 0 auto;
}
.zebra-toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.3);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-sub);
    flex-wrap: wrap;
    flex-shrink: 0;
}
.zebra-toolbar b { color: var(--primary); }
.zebra-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.zebra-problem {
    background: rgba(0,0,0,0.3);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--text-sub);
    max-height: 200px;
    overflow-y: auto;
    flex-shrink: 0;
}
.zebra-problem b { color: var(--primary); }
.zebra-problem .q { color: #fff; font-weight: 700; margin-top: 6px; display: block; }
.zebra-table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
}
.zebra-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    overflow: hidden;
    table-layout: fixed;
    min-width: 460px;
}
.zebra-table th, .zebra-table td {
    padding: 5px 4px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
}
.zebra-table th {
    background: rgba(0,0,0,0.3);
    color: var(--primary);
    font-weight: 600;
    font-size: 11.5px;
    white-space: nowrap;
}
.zebra-table select {
    background: rgba(30,41,59,0.9);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 4px 2px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    font-family: inherit;
    width: 100%;
    text-align-last: center;
    min-height: 34px;
}
.zebra-table select option { background: #1e293b; }
.zebra-table td.correct { background: rgba(74,222,128,0.25); }
.zebra-table td.wrong { background: rgba(239,68,68,0.15); }
.zebra-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    flex-shrink: 0;
}

@media (max-width: 767px) {
    .zebra-wrap { gap: 8px; }
    .zebra-toolbar { font-size: 12px; padding: 8px 10px; }
    .zebra-nav .btn {
        padding: 6px 10px !important;
        font-size: 12px !important;
        min-height: 36px;
    }
    .zebra-problem { font-size: 12px; padding: 10px 12px; max-height: 160px; }
    .zebra-table th, .zebra-table td { font-size: 11px; padding: 4px 2px; }
    .zebra-table select { font-size: 11px; padding: 3px 1px; min-height: 32px; }
    .zebra-btns .btn { font-size: 12px; padding: 8px 12px; min-height: 40px; }
}
</style>
</head>
<body class="embedded">
<div class="game-inner">

                <button class="btn ghost" id="btnNext" style="padding:6px 12px; font-size:13px;">下一题 →</button>

        <div class="zebra-table-wrap">

    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
    'use strict';

    document.body.classList.add('embedded');

    const MAX_HINTS = 3;
    const HOUSE_COUNT = 5;

    // ============================================================
    // 辅助：位置查询 + 相邻
    // ============================================================
    function posOf(assign, key, value) {
        for (let i = 0; i < assign.length; i++) {
            if (assign[i][key] === value) return i;
        }
        return -1;
    }
    function adjacent(a, b) {
        return a >= 0 && b >= 0 && Math.abs(a - b) === 1;
    }

    // ============================================================
    // 题库：10 道逻辑谜题
    // 所有 answer 由求解器算出，不写死
    // ============================================================

        {
            title: '爱因斯坦谜题',

            clueTexts: [

                '瑞典人养狗。',
                '丹麦人喝茶。',
                '绿房子在白房子的左边。',
                '绿房子的主人喝咖啡。',

                color:       { label: '颜色', values: ['黄色','蓝色','红色','绿色','白色'] },
                drink:       { label: '饮料', values: ['水','茶','牛奶','咖啡','啤酒'] },

                a => a[posOf(a,'nationality','瑞典人')] >= 0 && a[posOf(a,'nationality','瑞典人')].pet === '狗',
                a => a[posOf(a,'nationality','丹麦人')] >= 0 && a[posOf(a,'nationality','丹麦人')].drink === '茶',
                a => posOf(a,'color','绿色') >= 0 && posOf(a,'color','白色') >= 0 && posOf(a,'color','绿色') < posOf(a,'color','白色'),

                a => a[0] && a[0].color === '蓝色'

            target: { house: -1, key: 'fruit', value: '香蕉' }

            },

                a => adjacent(posOf(a,'job','教师'), posOf(a,'pet','鸟'))
            ],

        },

            clues: [

                a => a[posOf(a,'brand','奥迪')] >= 0 && a[posOf(a,'brand','奥迪')].color === '白色',
                a => a[posOf(a,'brand','特斯拉')] >= 0 && a[posOf(a,'brand','特斯拉')].fuel === '电动',

        },

            clueTexts: [
                '穿红衣服的人点浓缩咖啡。',
                '穿蓝衣服的人加牛奶。',
                '穿绿衣服的人看小说。',
                '中间位置的人点卡布奇诺。',
                '穿黄衣服的人点美式。',
                '穿白衣服的人坐在穿绿衣服的右边。',
                '看杂志的人加糖。',
                '看报纸的人点摩卡。',
                '加奶泡的人坐在加糖的人旁边。',
                '喝拿铁的人坐在第一位。'
            ],
            question: '谁看诗集？',
            categories: {
                color:  { label: '衣服', values: ['红色','蓝色','绿色','黄色','白色'] },
                coffee: { label: '咖啡', values: ['浓缩','拿铁','卡布奇诺','美式','摩卡'] },
                extra:  { label: '配料', values: ['牛奶','糖','奶泡','肉桂','可可'] },
                book:   { label: '书籍', values: ['小说','杂志','报纸','诗集','漫画'] }
            },
            clues: [
                a => a[posOf(a,'color','红色')] >= 0 && a[posOf(a,'color','红色')].coffee === '浓缩',
                a => a[posOf(a,'color','蓝色')] >= 0 && a[posOf(a,'color','蓝色')].extra === '牛奶',
                a => a[posOf(a,'color','绿色')] >= 0 && a[posOf(a,'color','绿色')].book === '小说',
                a => a[2] && a[2].coffee === '卡布奇诺',
                a => a[posOf(a,'color','黄色')] >= 0 && a[posOf(a,'color','黄色')].coffee === '美式',
                a => posOf(a,'color','白色') > posOf(a,'color','绿色'),
                a => a[posOf(a,'book','杂志')] && a[posOf(a,'book','杂志')].extra === '糖',
                a => a[posOf(a,'book','报纸')] && a[posOf(a,'book','报纸')].coffee === '摩卡',
                a => adjacent(posOf(a,'extra','奶泡'), posOf(a,'extra','糖')),
                a => a[0] && a[0].coffee === '拿铁'
            ],
            target: { house: -1, key: 'book', value: '诗集' }
        }
    ];

    // ============================================================
    // 求解器：回溯 + 剪枝
    // 返回 { solutions, count }
    // ============================================================
    function solve(categories, clues, houseCount) {
        houseCount = houseCount || HOUSE_COUNT;
        const keys = Object.keys(categories);
        const solutions = [];
        const MAX_SOLUTIONS = 500;

        // assignment[houseIdx][key] = value
        const assignment = Array.from({ length: houseCount }, () => ({}));

        // 为每列生成 value 的所有排列，逐列递归
        function permuteKey(keyIdx) {
            if (solutions.length > MAX_SOLUTIONS) return;
            if (keyIdx === keys.length) {
                if (clues.every(c => {
                    try { return c(assignment); } catch (e) { return false; }
                })) {
                    solutions.push(assignment.map(h => ({ ...h })));
                }
                return;
            }
            const key = keys[keyIdx];
            const values = categories[key].values.slice();
            permuteValues(key, values, 0, () => permuteKey(keyIdx + 1));
        }

        function permuteValues(key, values, idx, onDone) {
            if (solutions.length > MAX_SOLUTIONS) return;
            if (idx === values.length) {
                // 剪枝：检查目前已填的列是否能通过所有"只涉及已填列"的线索
                // 简化：不剪枝，直接递归
                onDone();
                return;
            }
            for (let i = idx; i < values.length; i++) {
                [values[idx], values[i]] = [values[i], values[idx]];
                assignment[idx][key] = values[idx];
                permuteValues(key, values, idx + 1, onDone);
                [values[idx], values[i]] = [values[i], values[idx]];
            }
        }

        permuteKey(0);
        return { solutions, count: solutions.length };
    }

    // ============================================================
    // 状态
    // ============================================================
    let currentIndex = 0;
    let state = [];
    let revealed = [];
    let hintCount = 0;
    let currentAnswer = null;
    let locked = false;

    const problemEl = document.getElementById('problem');
    const wrap = document.getElementById('tableWrap');
    const idxLabel = document.getElementById('idxLabel');
    const totalLabel = document.getElementById('totalLabel');
    const titleLabel = document.getElementById('titleLabel');
    const toastContainer = document.getElementById('toastContainer');
    const btnHint = document.getElementById('btnHint');

    function toast(text, type) {
        const el = document.createElement('div');
        el.className = 'toast' + (type ? ' ' + type : '');
        el.textContent = text;
        toastContainer.appendChild(el);
        setTimeout(() => {
            el.style.opacity = '0';
            el.style.transition = 'opacity 0.3s';
            setTimeout(() => el.remove(), 300);
        }, 2200);
    }

    const current = () => PUZZLES[currentIndex];

    // ============================================================
    // 加载题目
    // ============================================================
    function loadPuzzle(index) {
        currentIndex = ((index % PUZZLES.length) + PUZZLES.length) % PUZZLES.length;
        const p = current();

        state = Array.from({ length: HOUSE_COUNT }, () => {
            const obj = {};
            for (const k of Object.keys(p.categories)) obj[k] = '';
            return obj;
        });
        revealed = Array.from({ length: HOUSE_COUNT }, () => ({}));
        hintCount = 0;
        locked = false;
        btnHint.disabled = false;

        idxLabel.textContent = currentIndex + 1;
        totalLabel.textContent = PUZZLES.length;
        titleLabel.textContent = p.title;

        // 求唯一解
        currentAnswer = null;
        const t0 = performance.now();
        const res = solve(p.categories, p.clues, HOUSE_COUNT);
        const dt = (performance.now() - t0).toFixed(0);
        if (res.count === 1) {
            currentAnswer = res.solutions[0];
            console.log(`[zebra] 题「${p.title}」求解成功，耗时 ${dt}ms`);
        } else {
            console.warn(`[zebra] 题「${p.title}」解的数量 = ${res.count > 500 ? '>500' : res.count}（应为 1）`);
        }

        renderProblem();
        renderTable();
    }

    function renderProblem() {
        const p = current();
        let html = `<b>题目：</b>${p.intro}<br><b>线索：</b><br>`;
        p.clueTexts.forEach((c, i) => { html += `${i + 1}. ${c}<br>`; });
        html += `<span class="q">问题：${p.question}</span>`;
        problemEl.innerHTML = html;
    }

    function renderTable() {
        const p = current();
        const cats = Object.keys(p.categories);

        let html = '<table class="zebra-table"><thead><tr><th style="width:70px;">房子</th>';
        for (const k of cats) html += `<th>${p.categories[k].label}</th>`;
        html += '</tr></thead><tbody>';

        for (let i = 0; i < HOUSE_COUNT; i++) {
            html += `<tr><td><b>第 ${i + 1} 栋</b></td>`;
            for (const k of cats) {
                const isLocked = revealed[i][k];
                html += `<td class="${isLocked ? 'correct' : ''}">`;
                html += `<select data-house="${i}" data-cat="${k}" ${isLocked ? 'disabled' : ''}>`;
                html += `<option value="">--</option>`;
                for (const opt of p.categories[k].values) {
                    const sel = state[i][k] === opt ? ' selected' : '';
                    html += `<option value="${opt}"${sel}>${opt}</option>`;
                }
                html += `</select></td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        wrap.innerHTML = html;

        wrap.querySelectorAll('select').forEach(sel => {
            sel.onchange = () => {
                if (locked) { sel.value = state[+sel.dataset.house][sel.dataset.cat]; return; }
                const h = parseInt(sel.dataset.house, 10);
                const c = sel.dataset.cat;
                state[h][c] = sel.value;
                sel.parentElement.classList.remove('wrong');
            };
        });
    }

    // ============================================================
    // 检查
    // ============================================================
    function check() {
        if (locked) { toast('已完成，无需再检查', 'warn'); return; }
        const p = current();
        const cats = Object.keys(p.categories);

        for (let i = 0; i < HOUSE_COUNT; i++) {
            for (const k of cats) {
                if (!state[i][k]) { toast('还有格子未填写', 'warn'); return; }
            }
        }
        for (const k of cats) {
            const vals = state.map(s => s[k]);
            if (new Set(vals).size !== HOUSE_COUNT) {
                toast(`「${p.categories[k].label}」列有重复`, 'warn');
                return;
            }
        }
        const failed = [];
        p.clues.forEach((fn, i) => {
            try { if (!fn(state)) failed.push(i + 1); }
            catch (e) { failed.push(i + 1); }
        });
        if (failed.length > 0) {
            toast(`违反线索：第 ${failed.join('、')} 条`, 'error');
            return;
        }
        // 通关
        locked = true;
        const t = p.target;
        let answerText = '';
        if (t.house >= 0) {
            answerText = `${p.categories[t.key].label}为「${t.value}」的是第 ${t.house + 1} 栋。`;
        } else {
            const idx = currentAnswer ? currentAnswer.findIndex(h => h[t.key] === t.value) : -1;
            answerText = `${t.value}的是第 ${idx + 1} 栋。`;
        }
        toast(`🎉 完全正确！${answerText}`, 'success');
    }

    // ============================================================
    // 提示
    // ============================================================
    function hint() {
        if (locked) { toast('已完成', 'warn'); return; }
        if (hintCount >= MAX_HINTS) {
            toast(`提示次数已用完（${MAX_HINTS} 次）`, 'warn');
            btnHint.disabled = true;
            return;
        }
        if (!currentAnswer) {
            toast('本题无唯一解，无法提示', 'warn');
            return;
        }
        const p = current();
        const cats = Object.keys(p.categories);
        const wrongSlots = [];
        for (let i = 0; i < HOUSE_COUNT; i++) {
            for (const k of cats) {
                if (state[i][k] !== currentAnswer[i][k]) wrongSlots.push({ house: i, cat: k });
            }
        }
        if (wrongSlots.length === 0) {
            toast('已经全部正确，无需提示', 'warn');
            return;
        }
        const slot = wrongSlots[Math.floor(Math.random() * wrongSlots.length)];
        state[slot.house][slot.cat] = currentAnswer[slot.house][slot.cat];
        revealed[slot.house][slot.cat] = true;
        hintCount++;
        toast(`💡 已揭示：第 ${slot.house + 1} 栋的「${p.categories[slot.cat].label}」（剩余 ${MAX_HINTS - hintCount} 次）`, 'success');
        renderTable();
        if (hintCount >= MAX_HINTS) btnHint.disabled = true;
    }

    // ============================================================
    // 事件
    // ============================================================
    document.getElementById('btnCheck').onclick = check;
    btnHint.onclick = hint;
    document.getElementById('btnReset').onclick = () => loadPuzzle(currentIndex);
    document.getElementById('btnPrev').onclick = () => loadPuzzle(currentIndex - 1);
    document.getElementById('btnNext').onclick = () => loadPuzzle(currentIndex + 1);
    document.getElementById('btnRandom').onclick = () => {
        if (PUZZLES.length <= 1) return;
        let next;
        do { next = Math.floor(Math.random() * PUZZLES.length); }
        while (next === currentIndex);
        loadPuzzle(next);
    };

    // 方向键切题：焦点在 select 上时忽略
    document.addEventListener('keydown', e => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'select' || tag === 'input') return;
        if (e.key === 'ArrowLeft') loadPuzzle(currentIndex - 1);
        else if (e.key === 'ArrowRight') loadPuzzle(currentIndex + 1);
    });

    // ============================================================
    // 启动 + 自检
    // ============================================================
    (function selfTest() {
        console.log('[zebra] 启动自检开始…');
        PUZZLES.forEach((p, i) => {
            const res = solve(p.categories, p.clues, HOUSE_COUNT);
            if (res.count !== 1) {
                console.warn(`[zebra] 题「${p.title}」解的数量 = ${res.count > 500 ? '>500' : res.count}（应为 1）`);
            }
        });
        console.log('[zebra] 启动自检结束');
    })();

    loadPuzzle(0);
    GameBridge.notifyReady();
})();
