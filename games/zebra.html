<style>
.zebra-wrap {

    background: rgba(0,0,0,0.3);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-sub);
    flex-wrap: wrap;
}
.zebra-toolbar b { color: var(--primary); }
.zebra-nav { display: flex; gap: 6px; flex-wrap: wrap; }

.zebra-problem {
    background: rgba(0,0,0,0.3);
    padding: 12px 16px;

    font-size: 12.5px;

    color: var(--text-sub);

.zebra-problem b { color: var(--primary); }
.zebra-problem .q {
    color: #fff;
    font-weight: 700;
    margin-top: 6px;
    display: block;
}

.zebra-table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    -webkit-overflow-scrolling: touch;
}

.zebra-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    overflow: hidden;
    table-layout: fixed;
    min-width: 480px; /* 手机横向滚动 */
}
.zebra-table th, .zebra-table td {
    padding: 5px 4px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
}
.zebra-table th {
    background: rgba(0,0,0,0.3);
    color: var(--primary);
    font-weight: 600;
    font-size: 11.5px;
    white-space: nowrap;
}
.zebra-table select {
    background: rgba(30,41,59,0.9);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 4px 2px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    font-family: inherit;
    width: 100%;
    text-align-last: center;
    min-height: 34px;
}
.zebra-table select option { background: #1e293b; }
.zebra-table td.correct { background: rgba(74,222,128,0.25); }
.zebra-table td.wrong { background: rgba(239,68,68,0.15); }

.zebra-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}
.zebra-result {
    color: var(--primary);
    font-weight: 700;
    font-size: 14px;
    min-height: 22px;
    text-align: center;
    padding: 0 8px;
}
.zebra-result.warn { color: #fbbf24; }
.zebra-result.error { color: var(--danger); }

/* ---------- 手机 ---------- */
@media (max-width: 767px) {
    .zebra-wrap { gap: 8px; }
    .zebra-toolbar {
        font-size: 12px;

                '开混合动力车的人养狗。',
                '开 7 座车的人养猫。',
                '养鸟的人开 2 座车。',
                '开奔驰的人住在开特斯拉的人旁边。'
            ],
            question: '谁养鱼？',
            categories: {
                brand: { label: '品牌', values: ['奔驰','宝马','奥迪','特斯拉','丰田'] },
                color: { label: '颜色', values: ['红色','黑色','白色','蓝色','银色'] },
                fuel:  { label: '能源', values: ['汽油','柴油','电动','混合','氢能'] },
                seat:  { label: '座位', values: ['2座','4座','5座','7座','9座'] },
                pet:   { label: '宠物', values: ['狗','猫','鸟','鱼','兔子'] }
            },
            answer: [
                { brand:'奥迪',   color:'白色', fuel:'电动', seat:'2座', pet:'鸟' },
                { brand:'宝马',   color:'黑色', fuel:'混合', seat:'7座', pet:'猫' },
                { brand:'丰田',   color:'蓝色', fuel:'汽油', seat:'5座', pet:'鱼' },
                { brand:'奔驰',   color:'红色', fuel:'柴油', seat:'4座', pet:'狗' },
                { brand:'特斯拉', color:'银色', fuel:'氢能', seat:'9座', pet:'兔子' }
            ],
            target: { house: 2, key: 'brand', value: '丰田' }
        },
        {
            title: '五杯咖啡',
            intro: '5 个人在咖啡馆点了不同咖啡、加了不同配料、坐在不同位置、看不同书、穿不同颜色衣服。',
            clues: [
                '穿红衣服的人点浓缩咖啡。',
                '穿蓝衣服的人加牛奶。',
                '穿绿衣服的人看小说。',
                '中间位置的人点卡布奇诺。',
                '穿黄衣服的人点美式。',
                '穿白衣服的人坐在穿绿衣服的右边。',
                '看杂志的人加糖。',
                '看报纸的人点摩卡。',
                '加奶泡的人坐在加糖的人旁边。',
                '喝拿铁的人坐在第一位。'
            ],
            question: '谁看诗集？',
            categories: {
                color:  { label: '衣服', values: ['红色','蓝色','绿色','黄色','白色'] },
                coffee: { label: '咖啡', values: ['浓缩','拿铁','卡布奇诺','美式','摩卡'] },
                extra:  { label: '配料', values: ['牛奶','糖','奶泡','肉桂','可可'] },
                book:   { label: '书籍', values: ['小说','杂志','报纸','诗集','漫画'] }
            },
            answer: [
                { color:'蓝色', coffee:'拿铁',     extra:'牛奶', book:'杂志' },
                { color:'白色', coffee:'摩卡',     extra:'可可', book:'报纸' },
                { color:'红色', coffee:'卡布奇诺', extra:'肉桂', book:'小说' },
                { color:'绿色', coffee:'浓缩',     extra:'糖',   book:'诗集' },
                { color:'黄色', coffee:'美式',     extra:'奶泡', book:'漫画' }
            ],
            target: { house: 3, key: 'color', value: '绿色' }
        }
    ];

    let currentIndex = 0;
    let state = [];
    let revealed = [];
    let hintCount = 0;

    const problemEl = document.getElementById('problem');
    const wrap = document.getElementById('tableWrap');
    const resultEl = document.getElementById('result');
    const idxLabel = document.getElementById('idxLabel');
    const totalLabel = document.getElementById('totalLabel');
    const titleLabel = document.getElementById('titleLabel');

    const current = () => PUZZLES[currentIndex];

    function loadPuzzle(index) {
        currentIndex = ((index % PUZZLES.length) + PUZZLES.length) % PUZZLES.length;
        const p = current();

        state = Array.from({ length: 5 }, () => {
            const obj = {};
            for (const k of Object.keys(p.categories)) obj[k] = '';
            return obj;
        });
        revealed = Array.from({ length: 5 }, () => ({}));
        hintCount = 0;
        resultEl.textContent = '';
        resultEl.className = 'zebra-result';

        idxLabel.textContent = currentIndex + 1;
        totalLabel.textContent = PUZZLES.length;
        titleLabel.textContent = p.title;

        renderProblem();
        renderTable();
    }

    function renderProblem() {
        const p = current();
        let html = `<b>题目：</b>${p.intro}<br><b>线索：</b><br>`;
        p.clues.forEach((c, i) => {
            html += `${i + 1}. ${c}<br>`;
        });
        html += `<span class="q">问题：${p.question}</span>`;
        problemEl.innerHTML = html;
    }

    function renderTable() {
        const p = current();
        const cats = Object.keys(p.categories);

        let html = '<table class="zebra-table"><thead><tr><th style="width:70px;">房子</th>';
        for (const k of cats) html += `<th>${p.categories[k].label}</th>`;
        html += '</tr></thead><tbody>';

        for (let i = 0; i < 5; i++) {
            html += `<tr><td><b>第 ${i + 1} 栋</b></td>`;
            for (const k of cats) {
                const locked = revealed[i][k];
                html += `<td class="${locked ? 'correct' : ''}">`;
                html += `<select data-house="${i}" data-cat="${k}" ${locked ? 'disabled' : ''}>`;
                html += `<option value="">--</option>`;
                for (const opt of p.categories[k].values) {
                    const sel = state[i][k] === opt ? ' selected' : '';
                    html += `<option value="${opt}"${sel}>${opt}</option>`;
                }
                html += `</select></td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        wrap.innerHTML = html;

        wrap.querySelectorAll('select').forEach(sel => {
            sel.onchange = () => {
                const h = parseInt(sel.dataset.house, 10);
                const c = sel.dataset.cat;
                state[h][c] = sel.value;
            };
        });
    }

    function check() {
        const p = current();
        const cats = Object.keys(p.categories);

        for (let i = 0; i < 5; i++) {
            for (const k of cats) {
                if (!state[i][k]) {
                    resultEl.className = 'zebra-result warn';
                    resultEl.textContent = '⚠️ 还有格子未填写';
                    return;
                }
            }
        }
        for (const k of cats) {
            const vals = state.map(s => s[k]);
            if (new Set(vals).size !== 5) {
                resultEl.className = 'zebra-result warn';
                resultEl.textContent = `⚠️ 「${p.categories[k].label}」列有重复`;
                return;
            }
        }
        let allCorrect = true;
        for (let i = 0; i < 5; i++) {
            for (const k of cats) {
                if (state[i][k] !== p.answer[i][k]) allCorrect = false;
            }
        }
        if (allCorrect) {
            resultEl.className = 'zebra-result';
            const t = p.target;
            resultEl.textContent = `🎉 完全正确！${p.categories[t.key].label}为「${t.value}」的是第 ${t.house + 1} 栋。`;
        } else {
            resultEl.className = 'zebra-result error';
            resultEl.textContent = '❌ 答案有误，请再想想。';
        }
    }

    function hint() {
        if (hintCount >= MAX_HINTS) {
            resultEl.className = 'zebra-result warn';
            resultEl.textContent = `⚠️ 本题提示次数已用完（${MAX_HINTS} 次）`;
            return;
        }
        const p = current();
        const cats = Object.keys(p.categories);

        const empty = [];
        for (let i = 0; i < 5; i++) {
            for (const k of cats) {
                if (state[i][k] !== p.answer[i][k]) empty.push({ house: i, cat: k });
            }
        }
        if (empty.length === 0) {
            resultEl.className = 'zebra-result';
            resultEl.textContent = '已经全部正确，无需提示。';
            return;
        }
        const slot = empty[Math.floor(Math.random() * empty.length)];
        state[slot.house][slot.cat] = p.answer[slot.house][slot.cat];
        revealed[slot.house][slot.cat] = true;
        hintCount++;
        resultEl.className = 'zebra-result';
        resultEl.textContent = `💡 已揭示：第 ${slot.house + 1} 栋的「${p.categories[slot.cat].label}」（剩余提示 ${MAX_HINTS - hintCount} 次）`;
        renderTable();
    }

    document.getElementById('btnCheck').onclick = check;
    document.getElementById('btnHint').onclick = hint;
    document.getElementById('btnReset').onclick = () => loadPuzzle(currentIndex);
    document.getElementById('btnPrev').onclick = () => loadPuzzle(currentIndex - 1);
    document.getElementById('btnNext').onclick = () => loadPuzzle(currentIndex + 1);
    document.getElementById('btnRandom').onclick = () => {
        if (PUZZLES.length <= 1) return;
        let next;
        do { next = Math.floor(Math.random() * PUZZLES.length); }
        while (next === currentIndex);
        loadPuzzle(next);
    };

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') loadPuzzle(currentIndex - 1);
        else if (e.key === 'ArrowRight') loadPuzzle(currentIndex + 1);
    });

    loadPuzzle(0);
    GameBridge.notifyReady();
})();
</script>
</body>
</html>
