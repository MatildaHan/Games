<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图着色</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.gc-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.gc-info { color: var(--text-sub); font-size: 14px; }
.gc-info b { color: var(--primary-color); }
.gc-canvas-wrap { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; }
canvas { display: block; cursor: pointer; }
.color-picker { display: flex; gap: 8px; }
.color-swatch {
    width: 40px; height: 40px; border-radius: 8px;
    cursor: pointer; border: 3px solid transparent;
    transition: all 0.2s;
}
.color-swatch.active { border-color: #fff; transform: scale(1.1); }
</style>
</head>
<body>
<div class="game-inner">
    <div class="gc-wrap">
        <div class="gc-info">目标：给所有区域着色，相邻区域颜色不能相同。已用颜色：<b id="colorCount">0</b></div>
        <div class="gc-canvas-wrap"><canvas id="gcCanvas" width="600" height="400"></canvas></div>
        <div class="color-picker" id="colorPicker"></div>
        <div style="display:flex; gap:12px;">
            <button class="action-btn" id="btnNew">新地图</button>
        </div>
    </div>
</div>
<script>
const COLORS = ['#f87171','#60a5fa','#4ade80','#fbbf24','#a78bfa','#f472b6','#22d3ee','#fb923c'];
let currentColor = 0;
let regions = []; // {points:[], color: -1, label}
let canvas, ctx;

// 通过 Voronoi 图生成相邻区域
function generateMap() {
    const n = 8 + Math.floor(Math.random() * 5); // 8-12 个区域
    const seeds = [];
    for (let i = 0; i < n; i++) {
        seeds.push({
            x: 50 + Math.random() * 500,
            y: 50 + Math.random() * 300,
        });
    }
    regions = seeds.map((s, i) => ({ seed: s, color: -1, label: i }));
}

function computeVoronoi() {
    // 简化：采样每 4 像素判断归属
    const imgData = ctx.createImageData(canvas.width, canvas.height);
    for (let y = 0; y < canvas.height; y += 2) {
        for (let x = 0; x < canvas.width; x += 2) {
            let nearest = 0, minD = Infinity;
            regions.forEach((r, i) => {
                const d = (r.seed.x - x) ** 2 + (r.seed.y - y) ** 2;
                if (d < minD) { minD = d; nearest = i; }
            });
            for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
                const idx = ((y+dy) * canvas.width + (x+dx)) * 4;
                const c = regions[nearest].color >= 0 ? hexToRgb(COLORS[regions[nearest].color]) : [50, 60, 80];
                imgData.data[idx] = c[0]; imgData.data[idx+1] = c[1];
                imgData.data[idx+2] = c[2]; imgData.data[idx+3] = 255;
            }
        }
    }
    ctx.putImageData(imgData, 0, 0);
    // 画边界和标签
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    regions.forEach((r, i) => {
        ctx.fillStyle = '#fff';
        ctx.fillText(i + 1, r.seed.x, r.seed.y + 5);
    });
}

function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function findRegionAt(x, y) {
    let nearest = 0, minD = Infinity;
    regions.forEach((r, i) => {
        const d = (r.seed.x - x) ** 2 + (r.seed.y - y) ** 2;
        if (d < minD) { minD = d; nearest = i; }
    });
    return nearest;
}

function init() {
    canvas = document.getElementById('gcCanvas');
    ctx = canvas.getContext('2d');
    generateMap();
    computeVoronoi();
    buildColorPicker();
    updateColorCount();

    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const idx = findRegionAt(x, y);
        regions[idx].color = currentColor;
        computeVoronoi();
        updateColorCount();
        if (checkSolved()) {
            setTimeout(() => alert('🎉 完美着色！'), 100);
        }
    };
}

function buildColorPicker() {
    const el = document.getElementById('colorPicker');
    el.innerHTML = '';
    COLORS.forEach((c, i) => {
        const sw = document.createElement('div');
        sw.className = 'color-swatch' + (i === currentColor ? ' active' : '');
        sw.style.background = c;
        sw.onclick = () => {
            currentColor = i;
            buildColorPicker();
        };
        el.appendChild(sw);
    });
}

function updateColorCount() {
    const used = new Set(regions.filter(r => r.color >= 0).map(r => r.color));
    document.getElementById('colorCount').innerText = used.size;
}

// 简化版相邻检查：如果两个区域种子距离较近，视为相邻
function areAdjacent(i, j) {
    const a = regions[i].seed, b = regions[j].seed;
    const d = Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
    return d < 150;
}

function checkSolved() {
    for (let i = 0; i < regions.length; i++) {
        if (regions[i].color < 0) return false;
        for (let j = i + 1; j < regions.length; j++) {
            if (regions[j].color < 0) continue;
            if (areAdjacent(i, j) && regions[i].color === regions[j].color) return false;
        }
    }
    return true;
}

document.getElementById('btnNew').onclick = init;
init();
</script>
</body>
</html>
