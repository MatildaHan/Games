<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>图着色</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.gc-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 100%;
    justify-content: center;
}
.gc-info {
    color: var(--text-sub);
    font-size: 14px;
    text-align: center;
}
.gc-info b { color: var(--primary); }

.gc-canvas-wrap {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 8px;
    max-width: 100%;
    display: flex;
    justify-content: center;
}
.gc-canvas-wrap canvas {
    display: block;
    cursor: pointer;
    border-radius: 6px;
    max-width: 100%;
    height: auto;
    touch-action: manipulation;
}

.color-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
    padding: 0 8px;
}
.color-swatch {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.15s;
    min-width: 36px;
    min-height: 36px;
}
.color-swatch.active {
    border-color: #fff;
    transform: scale(1.1);
    box-shadow: 0 0 12px rgba(255,255,255,0.5);
}

/* ---------- 手机 ---------- */
@media (max-width: 767px) {
    .gc-info { font-size: 12px; }
    .gc-canvas-wrap { padding: 4px; }
    .color-swatch { width: 36px; height: 36px; }
}
</style>
</head>
<body>
<div class="game-inner">
    <div class="gc-wrap">
        <div class="gc-info">
            目标：给所有区域着色，相邻区域不能同色。已用颜色 <b id="colorCount">0</b>
        </div>
        <div class="gc-canvas-wrap">
            <canvas id="gcCanvas" width="600" height="400"></canvas>
        </div>
        <div class="color-picker" id="colorPicker"></div>
        <button class="btn" id="btnNew">新地图</button>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script>
(function () {
    'use strict';

    const COLORS = [
        '#f87171','#60a5fa','#4ade80','#fbbf24','#a78bfa',
        '#f472b6','#22d3ee','#fb923c','#facc15','#34d399'
    ];

    const canvas = document.getElementById('gcCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    let currentColor = 0;
    let regions = [];
    let pixelRegion = null;
    let adjacency = null;

    function hexToRgb(hex) {
        const v = parseInt(hex.slice(1), 16);
        return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }

    function generateSeeds(count) {
        const seeds = [];
        const margin = 50;
        const minDist = Math.sqrt((W - margin * 2) * (H - margin * 2) / count) * 0.75;
        let attempts = 0;
        while (seeds.length < count && attempts < 5000) {
            attempts++;
            const x = margin + Math.random() * (W - margin * 2);
            const y = margin + Math.random() * (H - margin * 2);
            let ok = true;
            for (const s of seeds) {
                if ((s.x - x) ** 2 + (s.y - y) ** 2 < minDist ** 2) { ok = false; break; }
            }
            if (ok) seeds.push({ x, y });
        }
        return seeds;
    }

    function computePixelRegions() {
        pixelRegion = new Int32Array(W * H);
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                let best = 0, bestD = Infinity;
                for (let i = 0; i < regions.length; i++) {
                    const s = regions[i].seed;
                    const d = (s.x - x) ** 2 + (s.y - y) ** 2;
                    if (d < bestD) { bestD = d; best = i; }
                }
                pixelRegion[y * W + x] = best;
            }
        }
    }

    function computeAdjacency() {
        adjacency = new Map();
        for (let i = 0; i < regions.length; i++) adjacency.set(i, new Set());
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const a = pixelRegion[y * W + x];
                if (x + 1 < W) {
                    const b = pixelRegion[y * W + (x + 1)];
                    if (a !== b) {
                        adjacency.get(a).add(b);
                        adjacency.get(b).add(a);
                    }
                }
                if (y + 1 < H) {
                    const b = pixelRegion[(y + 1) * W + x];
                    if (a !== b) {
                        adjacency.get(a).add(b);
                        adjacency.get(b).add(a);
                    }
                }
            }
        }
    }

    function draw() {
        const img = ctx.createImageData(W, H);
        const regionRgb = regions.map(r =>
            r.color >= 0 ? hexToRgb(COLORS[r.color]) : [50, 60, 80]
        );

        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const idx = pixelRegion[y * W + x];
                const c = regionRgb[idx];
                const p = (y * W + x) * 4;
                img.data[p] = c[0];
                img.data[p+1] = c[1];
                img.data[p+2] = c[2];
                img.data[p+3] = 255;
            }
        }
        ctx.putImageData(img, 0, 0);

        // 边界线
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const a = pixelRegion[y * W + x];
                if (x + 1 < W && pixelRegion[y * W + (x + 1)] !== a) {
                    ctx.moveTo(x + 1, y);
                    ctx.lineTo(x + 1, y + 1);
                }
                if (y + 1 < H && pixelRegion[(y + 1) * W + x] !== a) {
                    ctx.moveTo(x, y + 1);
                    ctx.lineTo(x + 1, y + 1);
                }
            }
        }
        ctx.stroke();

        // 编号
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const r of regions) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillText(r.label, r.seed.x + 1, r.seed.y + 1);
            ctx.fillStyle = '#fff';
            ctx.fillText(r.label, r.seed.x, r.seed.y);
        }
    }

    function buildColorPicker() {
        const picker = document.getElementById('colorPicker');
        picker.innerHTML = '';
        COLORS.forEach((c, i) => {
            const sw = document.createElement('div');
            sw.className = 'color-swatch' + (i === currentColor ? ' active' : '');
            sw.style.background = c;
            sw.onclick = () => { currentColor = i; buildColorPicker(); };
            picker.appendChild(sw);
        });
    }

    function updateColorCount() {
        const used = new Set(regions.filter(r => r.color >= 0).map(r => r.color));
        document.getElementById('colorCount').textContent = used.size;
    }

    function checkSolved() {
        for (const r of regions) if (r.color < 0) return false;
        for (const [i, neighbors] of adjacency) {
            for (const j of neighbors) {
                if (regions[i].color === regions[j].color) return false;
            }
        }
        return true;
    }

    function newMap() {
        const n = 8 + Math.floor(Math.random() * 5);
        const seeds = generateSeeds(n);
        regions = seeds.map((s, i) => ({ seed: s, color: -1, label: i + 1 }));

        computePixelRegions();
        computeAdjacency();

        draw();
        buildColorPicker();
        updateColorCount();
    }

    canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        // 处理 CSS 缩放（手机端画布可能被缩小）
        const x = Math.floor((e.clientX - rect.left) * (W / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (H / rect.height));
        if (x < 0 || x >= W || y < 0 || y >= H) return;

        const idx = pixelRegion[y * W + x];
        regions[idx].color = currentColor;
        draw();
        updateColorCount();

        if (checkSolved()) {
            setTimeout(() => alert('🎉 完美着色！'), 100);
        }
    });

    document.getElementById('btnNew').onclick = newMap;

    newMap();
    GameBridge.notifyReady();
})();
</script>
</body>
</html>
