<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数织</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.nono-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.nono-toolbar { display: flex; gap: 16px; align-items: center; color: var(--text-sub); font-size: 13px; }
.nono-toolbar b { color: var(--primary); }
.nono-grid { display: grid; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.5); border-radius: 6px; overflow: hidden; }
.nono-cell { width: 30px; height: 30px; background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: background 0.1s; }
.nono-cell:hover { background: rgba(255,255,255,0.08); }
.nono-cell.filled { background: var(--primary); box-shadow: inset 0 0 8px rgba(0,0,0,0.35); }
.nono-cell.marked { background: rgba(239,68,68,0.35); }
.nono-clue {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 6px; font-size: 12px; color: var(--text-sub);
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.05);
    font-weight: 600;
}
.nono-clue.top { justify-content: center; flex-direction: column; }
.nono-clue.corner { background: rgba(0,0,0,0.4); }
</style>
</head>
<body>
<div class="game-inner">
    <div class="nono-wrap">
        <div class="nono-toolbar">
            <span>尺寸 <b id="sizeLabel">—</b></span>
            <span>难度 <b id="levelLabel">—</b></span>
            <span>剩余 <b id="remainLabel" style="color: var(--primary);">—</b></span>
        </div>
        <div id="grid" class="nono-grid"></div>
        <div style="display:flex; gap:12px;">
            <button class="btn" id="btnNew">新游戏</button>
            <button class="btn ghost" id="btnCheck">检查</button>
            <button class="btn ghost" id="btnLevel">切换难度</button>
        </div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script>
(function () {
    'use strict';

    const LEVELS = [
        { size: 5,  density: 0.6, name: '简单' },
        { size: 10, density: 0.6, name: '困难' },
        { size: 15, density: 0.6, name: '专业' }
    ];

    let levelIdx = 0;
    let solution = [];
    let gridState = [];
    let totalFilled = 0;

    const gridEl = document.getElementById('grid');
    const sizeLabel = document.getElementById('sizeLabel');
    const levelLabel = document.getElementById('levelLabel');
    const remainLabel = document.getElementById('remainLabel');

    function generateSolution(size, density) {
        const sol = Array.from({ length: size }, () => Array(size).fill(0));
        for (let y = 0; y < size; y++) {
            for (let x = 0; x <= Math.floor((size - 1) / 2); x++) {
                const v = Math.random() < density ? 1 : 0;
                sol[y][x] = v;
                sol[y][size - 1 - x] = v;
            }
        }
        return sol;
    }

    function rowClue(row) {
        const clue = [];
        let cnt = 0;
        for (const v of row) {
            if (v) cnt++;
            else { if (cnt) clue.push(cnt); cnt = 0; }
        }
        if (cnt) clue.push(cnt);
        return clue.length ? clue : [0];
    }

    function colClue(sol, col) {
        return rowClue(sol.map(r => r[col]));
    }

    function countFilled() {
        let n = 0;
        solution.forEach(r => r.forEach(v => { if (v) n++; }));
        return n;
    }

    function render() {
        const size = solution.length;
        const rowClues = solution.map(rowClue);
        const colClues = Array.from({ length: size }, (_, c) => colClue(solution, c));
        const maxRowClue = Math.max(...rowClues.map(c => c.length));
        const maxColClue = Math.max(...colClues.map(c => c.length));
        const cellSize = 30;
        const clueSize = 24;

        gridEl.innerHTML = '';
        gridEl.style.gridTemplateColumns = `${maxRowClue * clueSize}px repeat(${size}, ${cellSize}px)`;
        gridEl.style.gridTemplateRows = `${maxColClue * clueSize}px repeat(${size}, ${cellSize}px)`;

        const corner = document.createElement('div');
        corner.className = 'nono-clue corner';
        corner.style.gridColumn = '1 / 2';
        corner.style.gridRow = '1 / 2';
        gridEl.appendChild(corner);

        for (let c = 0; c < size; c++) {
            const el = document.createElement('div');
            el.className = 'nono-clue top';
            el.style.gridColumn = `${c + 2} / ${c + 3}`;
            el.style.gridRow = '1 / 2';
            el.innerHTML = colClues[c].map(n => `<div>${n}</div>`).join('');
            gridEl.appendChild(el);
        }

        for (let r = 0; r < size; r++) {
            const rowEl = document.createElement('div');
            rowEl.className = 'nono-clue';
            rowEl.style.gridColumn = '1 / 2';
            rowEl.style.gridRow = `${r + 2} / ${r + 3}`;
            rowEl.innerText = rowClues[r].join(' ');
            gridEl.appendChild(rowEl);

            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'nono-cell';
                if (gridState[r][c] === 1) cell.classList.add('filled');
                if (gridState[r][c] === 2) cell.classList.add('marked');
                cell.addEventListener('click', () => toggle(r, c, 1));
                cell.addEventListener('contextmenu', e => { e.preventDefault(); toggle(r, c, 2); });
                gridEl.appendChild(cell);
            }
        }
    }

    function toggle(r, c, mode) {
        if (mode === 1) {
            gridState[r][c] = gridState[r][c] === 1 ? 0 : 1;
        } else {
            gridState[r][c] = gridState[r][c] === 2 ? 0 : 2;
        }
        render();
        updateRemain();
        checkWin();
    }

    function updateRemain() {
        let filled = 0;
        gridState.forEach(r => r.forEach(v => { if (v === 1) filled++; }));
        const diff = totalFilled - filled;
        if (diff > 0) {
            remainLabel.textContent = diff;
            remainLabel.style.color = 'var(--primary)';
        } else if (diff === 0) {
            remainLabel.textContent = '0';
            remainLabel.style.color = 'var(--primary)';
        } else {
            remainLabel.textContent = `超出 ${-diff}`;
            remainLabel.style.color = 'var(--danger)';
        }
    }

    function checkWin() {
        const size = solution.length;
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const want = solution[r][c] === 1;
                const have = gridState[r][c] === 1;
                if (want !== have) return;
            }
        }
        setTimeout(() => alert('🎉 恭喜完成数织！'), 50);
    }

    function checkAnswer() {
        const size = solution.length;
        let errors = 0;
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const want = solution[r][c] === 1;
                const have = gridState[r][c] === 1;
                if (want !== have) errors++;
            }
        }
        if (errors === 0) {
            alert('🎉 全部正确！');
        } else {
            alert(`还有 ${errors} 处需要调整`);
        }
    }

    function newGame() {
        const lv = LEVELS[levelIdx];
        solution = generateSolution(lv.size, lv.density);
        gridState = Array.from({ length: lv.size }, () => Array(lv.size).fill(0));
        totalFilled = countFilled();
        sizeLabel.textContent = `${lv.size} × ${lv.size}`;
        levelLabel.textContent = lv.name;
        updateRemain();
        render();
    }

    document.getElementById('btnNew').onclick = newGame;
    document.getElementById('btnCheck').onclick = checkAnswer;
    document.getElementById('btnLevel').onclick = () => {
        levelIdx = (levelIdx + 1) % LEVELS.length;
        newGame();
    };

    newGame();
    GameBridge.notifyReady();
})();
</script>
</body>
</html>
