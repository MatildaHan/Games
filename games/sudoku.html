<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数独</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.sudoku-layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
}

/* 左侧难度选择 */
.difficulty-sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 160px;
}
.difficulty-title { font-size: 14px; color: var(--text-sub); margin-bottom: 4px; font-weight: 500; }
.diff-btn {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
    transition: all 0.2s;
    position: relative;
}
.diff-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
.diff-btn.active {
    background: var(--primary-color);
    color: #000;
    font-weight: bold;
    border-color: var(--primary-color);
}
.diff-btn:disabled {
    background: rgba(71, 85, 105, 0.3);
    color: #64748b;
    cursor: not-allowed;
    border-color: rgba(255,255,255,0.05);
}
.diff-btn .progress {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
}
.diff-btn.active .progress { color: #064e3b; }

/* 数独主区域 */
.sudoku-main { display: flex; flex-direction: column; align-items: center; }
.sudoku-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}
.sudoku-status { color: var(--text-sub); font-size: 14px; }

.sudoku-board {
    display: grid;
    grid-template-columns: repeat(9, 48px);
    grid-template-rows: repeat(9, 48px);
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.sudoku-cell {
    width: 48px;
    height: 48px;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    font-size: 22px;
    font-weight: 500;
    text-align: center;
    outline: none;
    transition: all 0.15s;
    cursor: pointer;
    -moz-appearance: textfield;
}
.sudoku-cell::-webkit-outer-spin-button,
.sudoku-cell::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.sudoku-cell:nth-child(3n) { border-right: 2px solid rgba(255, 255, 255, 0.3); }
.sudoku-cell:nth-child(9n) { border-right: none; }
.sudoku-cell:nth-child(n+19):nth-child(-n+27),
.sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid rgba(255, 255, 255, 0.3); }

.sudoku-cell.prefilled { color: #94a3b8; font-weight: bold; cursor: default; }
.sudoku-cell.highlight-light { background: rgba(74, 222, 128, 0.15); }
.sudoku-cell.highlight-same { background: rgba(74, 222, 128, 0.3); color: #fff; }
.sudoku-cell.selected { background: rgba(74, 222, 128, 0.5); box-shadow: inset 0 0 0 2px var(--primary-color); }
.sudoku-cell.error { color: #ef4444; }

/* 右侧数字键盘 */
.number-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: rgba(0, 0, 0, 0.3);
    padding: 12px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.05);
}

.num-btn {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--text-main);
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}
.num-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
.num-btn:active { transform: translateY(0); }
.num-btn.erase {
    grid-column: span 3;
    width: 100%;
    background: rgba(239, 68, 68, 0.2);
    color: #ef4444;
    font-size: 16px;
}
.num-btn.erase:hover { background: rgba(239, 68, 68, 0.4); }
</style>
</head>
<body>
<div class="game-inner">
    <div class="sudoku-layout">
        <!-- 左侧难度选择 -->
        <div class="difficulty-sidebar" id="difficulty-selector">
            <div class="difficulty-title">选择难度</div>
            <!-- 难度按钮由 JS 生成 -->
        </div>

        <!-- 中间棋盘 -->
        <div class="sudoku-main">
            <div class="sudoku-header">
                <div class="sudoku-status" id="sudoku-status">当前难度：简单</div>
            </div>
            <div class="sudoku-board" id="sudoku-board"></div>
        </div>

        <!-- 右侧数字键盘 -->
        <div class="number-pad" id="number-pad"></div>
    </div>
</div>

<script>
    // ==========================================
    // 数独 (Sudoku)
    // ==========================================
    const sudokuBoard = document.getElementById('sudoku-board');
    const diffSelector = document.getElementById('difficulty-selector');
    const numberPad = document.getElementById('number-pad');
    const sudokuStatus = document.getElementById('sudoku-status');

    // 基础完整解
    const BASE_SOLUTIONS = [
        "534678912672195348198342567859761423426853791713924856961537284287419635345286179",
        "435269781682571493197834562826195347374682915951743628519326874248957136763418259",
        "817654923493827156526913874732569418951478362648231795179345682385792641264186539",
        "123456789456789123789123456214365897365897214897214365531642978642978531978531642"
    ];

    const DIFFICULTIES = [
        { name: "简单", holes: 20, level: 0 },
        { name: "困难", holes: 35, level: 1 },
        { name: "专业", holes: 45, level: 2 },
        { name: "大师", holes: 52, level: 3 },
        { name: "巅峰", holes: 58, level: 4 }
    ];

    let currentSolution = "";
    let currentDifficultyLevel = 0;
    let selectedCellIndex = null;

    // 获取进度（localStorage）
    function getProgress() {
        try {
            let progress = JSON.parse(localStorage.getItem('sudokuProgress'));
            if (!progress || !Array.isArray(progress) || progress.length !== 5) {
                progress = [0, 0, 0, 0, 0];
                localStorage.setItem('sudokuProgress', JSON.stringify(progress));
            }
            return progress;
        } catch (e) {
            return [0, 0, 0, 0, 0];
        }
    }

    function updateProgress(level) {
        let progress = getProgress();
        progress[level]++;
        localStorage.setItem('sudokuProgress', JSON.stringify(progress));
        renderDifficultyButtons();
    }

    // 渲染难度按钮（左侧）
    function renderDifficultyButtons() {
        const progress = getProgress();
        diffSelector.innerHTML = '<div class="difficulty-title">选择难度</div>';

        DIFFICULTIES.forEach((diff, index) => {
            const btn = document.createElement('button');
            let isUnlocked = index === 0 || progress[index - 1] >= 10;
            let isActive = index === currentDifficultyLevel;

            btn.className = `diff-btn ${isActive ? 'active' : ''}`;

            if (!isUnlocked) {
                btn.disabled = true;
                btn.innerHTML = `${diff.name} 🔒 <span class="progress">需前一关10次</span>`;
            } else {
                let progressText = index === 4 ? '已满级' : `进度: ${progress[index]}/10`;
                btn.innerHTML = `${diff.name} <span class="progress">${progressText}</span>`;
                btn.onclick = () => {
                    currentDifficultyLevel = index;
                    renderDifficultyButtons();
                    initSudoku(diff.holes);
                };
            }
            diffSelector.appendChild(btn);
        });
    }

    // 初始化数独
    function initSudoku(holes) {
        currentSolution = BASE_SOLUTIONS[Math.floor(Math.random() * BASE_SOLUTIONS.length)];
        let puzzleArray = currentSolution.split('');

        // 挖洞
        let holesToDig = holes;
        while (holesToDig > 0) {
            const idx = Math.floor(Math.random() * 81);
            if (puzzleArray[idx] !== '0') {
                puzzleArray[idx] = '0';
                holesToDig--;
            }
        }
        const puzzleStr = puzzleArray.join('');

        sudokuBoard.innerHTML = '';
        selectedCellIndex = null;

        for (let i = 0; i < 81; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 1;
            input.classList.add('sudoku-cell');
            input.dataset.index = i;

            const val = puzzleStr[i];
            if (val !== '0') {
                input.value = val;
                input.readOnly = true;
                input.classList.add('prefilled');
            } else {
                input.addEventListener('input', handleSudokuInput);
                input.addEventListener('keydown', handleSudokuKeydown);
            }
            input.addEventListener('focus', () => handleCellFocus(i));
            input.addEventListener('click', () => handleCellFocus(i));

            sudokuBoard.appendChild(input);
        }

        sudokuStatus.innerText = `当前难度：${DIFFICULTIES[currentDifficultyLevel].name}`;
        clearHighlights();
    }

    // 处理格子选中高亮
    function handleCellFocus(index) {
        selectedCellIndex = index;
        clearHighlights();

        const row = Math.floor(index / 9);
        const col = index % 9;
        const boxRow = Math.floor(row / 3) * 3;
        const boxCol = Math.floor(col / 3) * 3;
        const val = sudokuBoard.children[index].value;

        for (let i = 0; i < 81; i++) {
            const cell = sudokuBoard.children[i];
            const r = Math.floor(i / 9);
            const c = i % 9;

            // 同行、同列、同宫格 → 浅背景
            if (r === row || c === col || (r >= boxRow && r < boxRow + 3 && c >= boxCol && c < boxCol + 3)) {
                if (i !== index) cell.classList.add('highlight-light');
            }

            // 相同数字 → 加深
            if (val && cell.value === val && i !== index) {
                cell.classList.add('highlight-same');
            }
        }
        sudokuBoard.children[index].classList.add('selected');
    }

    function clearHighlights() {
        for (let i = 0; i < 81; i++) {
            sudokuBoard.children[i].classList.remove('highlight-light', 'highlight-same', 'selected');
        }
    }

    // 键盘输入
    function handleSudokuInput(e) {
        const input = e.target;
        input.value = input.value.replace(/[^1-9]/g, '');
        input.classList.remove('error');
        if (input.value !== '' && !isValidMove(input)) input.classList.add('error');
        checkSudokuCompletion();
    }

    function handleSudokuKeydown(e) {
        const index = parseInt(e.target.dataset.index);
        let nextIndex = null;
        if (e.key === 'ArrowUp' && index >= 9) nextIndex = index - 9;
        if (e.key === 'ArrowDown' && index < 72) nextIndex = index + 9;
        if (e.key === 'ArrowLeft' && index % 9 !== 0) nextIndex = index - 1;
        if (e.key === 'ArrowRight' && index % 9 !== 8) nextIndex = index + 1;

        if (nextIndex !== null) {
            e.preventDefault();
            sudokuBoard.children[nextIndex].focus();
        }
    }

    // 右侧数字键盘
    numberPad.addEventListener('click', e => {
        if (e.target.classList.contains('num-btn')) {
            if (selectedCellIndex === null) {
                alert('请先点击棋盘上的空格！');
                return;
            }
            const input = sudokuBoard.children[selectedCellIndex];
            if (input.readOnly) return;

            const val = e.target.dataset.val;
            input.value = val === '0' ? '' : val;
            input.classList.remove('error');

            if (input.value !== '' && !isValidMove(input)) {
                input.classList.add('error');
            }
            handleCellFocus(selectedCellIndex);
            checkSudokuCompletion();
        }
    });

    // 校验规则
    function isValidMove(input) {
        const index = parseInt(input.dataset.index);
        const val = input.value;
        if (!val) return true;
        const row = Math.floor(index / 9), col = index % 9;
        const boxRow = Math.floor(row / 3) * 3, boxCol = Math.floor(col / 3) * 3;

        for (let i = 0; i < 9; i++) {
            if (i !== col && sudokuBoard.children[row * 9 + i].value === val) return false;
            if (i !== row && sudokuBoard.children[i * 9 + col].value === val) return false;
        }
        for (let r = boxRow; r < boxRow + 3; r++) {
            for (let c = boxCol; c < boxCol + 3; c++) {
                const ci = r * 9 + c;
                if (ci !== index && sudokuBoard.children[ci].value === val) return false;
            }
        }
        return true;
    }

    // 检查完成
    function checkSudokuCompletion() {
        let isComplete = true;
        for (let i = 0; i < 81; i++) {
            if (sudokuBoard.children[i].value === '') {
                isComplete = false;
                break;
            }
        }
        if (isComplete) {
            let hasError = false;
            for (let i = 0; i < 81; i++) {
                if (sudokuBoard.children[i].value !== currentSolution[i]) {
                    hasError = true;
                    sudokuBoard.children[i].classList.add('error');
                }
            }
            if (!hasError) {
                setTimeout(() => {
                    alert('恭喜你，完美通关！');
                    updateProgress(currentDifficultyLevel);
                    initSudoku(DIFFICULTIES[currentDifficultyLevel].holes);
                }, 100);
            }
        }
    }

    // ==========================================
    // 初始化执行顺序
    // ==========================================

    // 1. 先构建数字键盘 1-9 + 清除
    function buildNumberPad() {
        numberPad.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.dataset.val = i;
            btn.innerText = i;
            numberPad.appendChild(btn);
        }
        const eraseBtn = document.createElement('button');
        eraseBtn.className = 'num-btn erase';
        eraseBtn.dataset.val = '0';
        eraseBtn.innerText = '清除';
        numberPad.appendChild(eraseBtn);
    }

    // 2. 启动
    function initSudokuGame() {
        buildNumberPad();
        renderDifficultyButtons();
        initSudoku(DIFFICULTIES[0].holes);
    }

    initSudokuGame();
</script>
</body>
</html>
