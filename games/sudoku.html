<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数独</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.sudoku-layout {
    display: grid;
    grid-template-columns: 160px auto 180px;
    gap: 28px;
    align-items: flex-start;
}
.diff-list { display: flex; flex-direction: column; gap: 10px; }
.diff-btn {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
    transition: all 0.2s;
    font-family: inherit;
}
.diff-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
.diff-btn.active { background: var(--primary); color: #000; font-weight: 700; border-color: var(--primary); }
.diff-btn:disabled { background: rgba(71, 85, 105, 0.3); color: #64748b; cursor: not-allowed; border-color: transparent; }
.diff-btn .prog { display: block; font-size: 11px; color: #94a3b8; margin-top: 3px; }
.diff-btn.active .prog { color: #064e3b; }

.sudoku-board {
    display: grid;
    grid-template-columns: repeat(9, 48px);
    grid-template-rows: repeat(9, 48px);
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 6px;
    overflow: hidden;
}
.sudoku-cell {
    width: 48px; height: 48px;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 22px;
    font-weight: 500;
    text-align: center;
    outline: none;
    transition: background 0.15s;
    cursor: pointer;
    font-family: inherit;
    -moz-appearance: textfield;
}
.sudoku-cell::-webkit-outer-spin-button,
.sudoku-cell::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sudoku-cell:nth-child(3n) { border-right: 2px solid rgba(255, 255, 255, 0.3); }
.sudoku-cell:nth-child(9n) { border-right: none; }
.sudoku-cell:nth-child(n+19):nth-child(-n+27),
.sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid rgba(255, 255, 255, 0.3); }

.sudoku-cell.prefilled { color: #94a3b8; font-weight: 700; cursor: pointer; }
.sudoku-cell.hl-light { background: var(--primary-dim); }
.sudoku-cell.hl-same { background: var(--primary-mid); color: #fff; }
.sudoku-cell.selected { background: rgba(74, 222, 128, 0.5); box-shadow: inset 0 0 0 2px var(--primary); }
.sudoku-cell.error { color: var(--danger); }

.number-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 12px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.05);
}
.num-btn {
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
}
.num-btn:hover { background: rgba(255,255,255,0.15); }
.num-btn.erase { grid-column: span 3; width: 100%; background: rgba(239, 68, 68, 0.2); color: var(--danger); font-size: 14px; }
.num-btn.erase:hover { background: rgba(239, 68, 68, 0.4); }
</style>
</head>
<body>
<div class="game-inner">
    <div class="sudoku-layout">
        <div class="diff-list" id="diffList">
            <div class="card-title" style="margin-bottom:4px;">难度</div>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
            <div style="color: var(--text-sub); font-size: 13px;" id="status">当前难度：简单</div>
            <div class="sudoku-board" id="board"></div>
        </div>

        <div class="number-pad" id="numberPad"></div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script>
(function () {
    'use strict';

    const SOLUTIONS = [
        "534678912672195348198342567859761423426853791713924856961537284287419635345286179",
        "435269781682571493197834562826195347374682915951743628519326874248957136763418259",
        "817654923493827156526913874732569418951478362648231795179345682385792641264186539",
        "123456789456789123789123456214365897365897214897214365531642978642978531978531642"
    ];

    const DIFFS = [
        { name: '简单', holes: 20 },
        { name: '困难', holes: 35 },
        { name: '专业', holes: 45 },
        { name: '大师', holes: 52 },
        { name: '巅峰', holes: 58 }
    ];

    const STORAGE_KEY = 'sudokuProgress';
    const UNLOCK_THRESHOLD = 10;

    let solution = '';
    let difficulty = 0;
    let selectedIdx = null;

    const boardEl = document.getElementById('board');
    const diffList = document.getElementById('diffList');
    const numberPad = document.getElementById('numberPad');
    const statusEl = document.getElementById('status');

    function loadProgress() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const arr = raw ? JSON.parse(raw) : null;
            if (Array.isArray(arr) && arr.length === DIFFS.length) return arr;
        } catch (e) {}
        return new Array(DIFFS.length).fill(0);
    }
    function saveProgress(p) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
    }
    function isUnlocked(level, progress) {
        return level === 0 || progress[level - 1] >= UNLOCK_THRESHOLD;
    }

    function buildDiffButtons() {
        const progress = loadProgress();
        diffList.innerHTML = '<div class="card-title" style="margin-bottom:4px;">难度</div>';
        DIFFS.forEach((d, i) => {
            const btn = document.createElement('button');
            const unlocked = isUnlocked(i, progress);
            btn.className = 'diff-btn' + (i === difficulty ? ' active' : '');
            if (!unlocked) {
                btn.disabled = true;
                btn.innerHTML = `${d.name} 🔒<span class="prog">通关前一难度 ${UNLOCK_THRESHOLD} 次解锁</span>`;
            } else {
                const p = progress[i];
                const progText = i === DIFFS.length - 1
                    ? (p >= UNLOCK_THRESHOLD ? '已满级' : `进度 ${p}/${UNLOCK_THRESHOLD}`)
                    : `进度 ${p}/${UNLOCK_THRESHOLD}`;
                btn.innerHTML = `${d.name}<span class="prog">${progText}</span>`;
                btn.onclick = () => {
                    if (i === difficulty) return;
                    difficulty = i;
                    buildDiffButtons();
                    newGame();
                };
            }
            diffList.appendChild(btn);
        });
    }

    function buildNumberPad() {
        numberPad.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
            const b = document.createElement('button');
            b.className = 'num-btn';
            b.dataset.val = i;
            b.textContent = i;
            numberPad.appendChild(b);
        }
        const e = document.createElement('button');
        e.className = 'num-btn erase';
        e.dataset.val = '0';
        e.textContent = '清除';
        numberPad.appendChild(e);
    }

    function generatePuzzle(holes) {
        solution = SOLUTIONS[Math.floor(Math.random() * SOLUTIONS.length)];
        const arr = solution.split('');
        let remaining = holes;
        while (remaining > 0) {
            const idx = Math.floor(Math.random() * 81);
            if (arr[idx] !== '0') {
                arr[idx] = '0';
                remaining--;
            }
        }
        return arr.join('');
    }

    function renderBoard(puzzleStr) {
        boardEl.innerHTML = '';
        selectedIdx = null;
        for (let i = 0; i < 81; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 1;
            input.classList.add('sudoku-cell');
            input.dataset.index = i;
            const v = puzzleStr[i];
            if (v !== '0') {
                input.value = v;
                input.readOnly = true;
                input.classList.add('prefilled');
            } else {
                input.addEventListener('input', onInput);
                input.addEventListener('keydown', onKeydown);
            }
            input.addEventListener('click', () => focusCell(i));
            boardEl.appendChild(input);
        }
        statusEl.textContent = `当前难度：${DIFFS[difficulty].name}`;
    }

    function focusCell(idx) {
        if (selectedIdx === idx) {
            clearHighlights();
            selectedIdx = null;
            return;
        }
        selectedIdx = idx;
        clearHighlights();
        const row = Math.floor(idx / 9), col = idx % 9;
        const boxR = Math.floor(row / 3) * 3, boxC = Math.floor(col / 3) * 3;
        const val = boardEl.children[idx].value;

        for (let i = 0; i < 81; i++) {
            const cell = boardEl.children[i];
            const r = Math.floor(i / 9), c = i % 9;
            const inBox = r >= boxR && r < boxR + 3 && c >= boxC && c < boxC + 3;
            if (i !== idx && (r === row || c === col || inBox)) {
                cell.classList.add('hl-light');
            }
            if (val && i !== idx && cell.value === val) {
                cell.classList.add('hl-same');
            }
        }
        boardEl.children[idx].classList.add('selected');
    }

    function clearHighlights() {
        for (let i = 0; i < 81; i++) {
            boardEl.children[i].classList.remove('hl-light', 'hl-same', 'selected');
        }
    }

    function onInput(e) {
        const input = e.target;
        input.value = input.value.replace(/[^1-9]/g, '');
        input.classList.remove('error');
        if (input.value && !isValid(input)) input.classList.add('error');
        checkCompletion();
    }

    function onKeydown(e) {
        const idx = parseInt(e.target.dataset.index, 10);
        let next = null;
        if (e.key === 'ArrowUp' && idx >= 9) next = idx - 9;
        if (e.key === 'ArrowDown' && idx < 72) next = idx + 9;
        if (e.key === 'ArrowLeft' && idx % 9 !== 0) next = idx - 1;
        if (e.key === 'ArrowRight' && idx % 9 !== 8) next = idx + 1;
        if (next !== null) {
            e.preventDefault();
            boardEl.children[next].click();
        }
    }

    numberPad.addEventListener('click', e => {
        const btn = e.target.closest('.num-btn');
        if (!btn) return;
        if (selectedIdx === null) {
            flashStatus('请先点击棋盘上的空格');
            return;
        }
        const input = boardEl.children[selectedIdx];
        if (input.readOnly) {
            // 修复：明确提示用户不能修改预填格
            flashStatus('预填数字不可修改');
            return;
        }
        const val = btn.dataset.val;
        input.value = val === '0' ? '' : val;
        input.classList.remove('error');
        if (input.value && !isValid(input)) input.classList.add('error');
        focusCell(selectedIdx);
        checkCompletion();
    });

    function isValid(input) {
        const idx = parseInt(input.dataset.index, 10);
        const val = input.value;
        if (!val) return true;
        const row = Math.floor(idx / 9), col = idx % 9;
        const boxR = Math.floor(row / 3) * 3, boxC = Math.floor(col / 3) * 3;
        for (let i = 0; i < 9; i++) {
            if (i !== col && boardEl.children[row * 9 + i].value === val) return false;
            if (i !== row && boardEl.children[i * 9 + col].value === val) return false;
        }
        for (let r = boxR; r < boxR + 3; r++) {
            for (let c = boxC; c < boxC + 3; c++) {
                const ci = r * 9 + c;
                if (ci !== idx && boardEl.children[ci].value === val) return false;
            }
        }
        return true;
    }

    let statusTimer = null;
    function flashStatus(text) {
        statusEl.textContent = text;
        if (statusTimer) clearTimeout(statusTimer);
        statusTimer = setTimeout(() => {
            statusEl.textContent = `当前难度：${DIFFS[difficulty].name}`;
        }, 1500);
    }

    function checkCompletion() {
        let complete = true, hasError = false;
        for (let i = 0; i < 81; i++) {
            const v = boardEl.children[i].value;
            if (!v) { complete = false; break; }
        }
        if (!complete) return;
        for (let i = 0; i < 81; i++) {
            if (boardEl.children[i].value !== solution[i]) {
                hasError = true;
                boardEl.children[i].classList.add('error');
            }
        }
        if (hasError) return;

        const progress = loadProgress();
        progress[difficulty]++;
        saveProgress(progress);
        buildDiffButtons();

        setTimeout(() => {
            alert('恭喜你，完美通关！');
            newGame();
        }, 100);
    }

    function newGame() {
        const puzzle = generatePuzzle(DIFFS[difficulty].holes);
        renderBoard(puzzle);
    }

    GameBridge.onParentMessage(() => {});

    buildDiffButtons();
    buildNumberPad();
    newGame();
    GameBridge.notifyReady();
})();
</script>
</body>
</html>
