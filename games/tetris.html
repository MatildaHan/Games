<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>俄罗斯方块</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ============================================================
   像素复古主题：全部用 .px-theme 作用域，避免污染其他游戏
   ============================================================ */

/* 只在 .px-theme 下使用像素字体 */
.px-theme,
.px-theme * {
    font-family: "Press Start 2P", "Courier New", monospace;
}
.px-theme {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

/* ============================================================
   像素主题背景（只在 .px-theme 上生效）
   ============================================================ */
.px-theme.game-inner {
    background:
        radial-gradient(ellipse at center, #1a2140 0%, #0b0e1a 70%),
        #0b0e1a;
    /* 保持与 common.css 的 padding 一致 */
    padding: 16px;
}
/* 网格背景 */
.px-theme.game-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
        linear-gradient(rgba(58, 74, 122, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58, 74, 122, 0.15) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
}
/* CRT 扫描线 */
.px-theme.game-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
    );
    opacity: 0.35;
}
/* 内容层要在背景之上 */
.px-theme .tetris-layout {
    position: relative;
    z-index: 2;
}

/* ============================================================
   色板
   ============================================================ */
.px-theme {
    --px-bg:        #0b0e1a;
    --px-panel:     #1a2140;
    --px-panel-2:   #222a52;
    --px-border:    #3a4a7a;
    --px-border-hi: #6a7ec4;
    --px-text:      #e8f0ff;
    --px-text-dim:  #8a9ac4;
    --px-accent:    #f7d51d;
}

/* ============================================================
   布局：flex（与其他游戏一致）
   ============================================================ */
.px-theme .tetris-layout {
    display: flex;
    flex-wrap: nowrap;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    min-height: 100%;
}
.px-theme .tetris-side {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
    flex-shrink: 0;
}

/* ============================================================
   像素卡片
   ============================================================ */
.px-theme .px-card {
    background: var(--px-panel);
    border: 3px solid var(--px-border);
    box-shadow:
        inset 0 0 0 3px var(--px-bg),
        inset 0 0 0 6px var(--px-panel-2),
        0 0 0 3px var(--px-bg),
        6px 6px 0 0 rgba(0, 0, 0, 0.5);
    padding: 16px;
    border-radius: 0;
    position: relative;
}
.px-theme .px-card .card-title {
    font-size: 10px;
    color: var(--px-text-dim);
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
}
.px-theme .px-card .card-value {
    font-size: 20px;
    color: var(--px-accent);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #000;
}

/* ============================================================
   画布
   ============================================================ */
.px-theme #tetris-canvas {
    display: block;
    background: #000;
    border: 4px solid var(--px-border);
    box-shadow:
        inset 0 0 0 4px var(--px-bg),
        0 0 0 4px var(--px-bg),
        8px 8px 0 0 rgba(0, 0, 0, 0.6);
    max-width: 100%;
    height: auto;
    touch-action: none;
    image-rendering: pixelated;
    flex-shrink: 0;
}
.px-theme #next-canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
    background: #000;
    border: 2px solid var(--px-border);
    image-rendering: pixelated;
}

/* ============================================================
   像素按钮
   ============================================================ */
.px-theme .px-btn {
    background: var(--px-panel-2);
    color: var(--px-text);
    border: 3px solid var(--px-border);
    box-shadow:
        inset -3px -3px 0 0 rgba(0, 0, 0, 0.5),
        inset 3px 3px 0 0 var(--px-border-hi),
        0 0 0 3px var(--px-bg),
        4px 4px 0 0 rgba(0, 0, 0, 0.6);
    padding: 12px 16px;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 0;
    font-family: inherit;
    min-height: 44px;
    text-transform: uppercase;
    transition: transform 0.05s, box-shadow 0.05s;
    width: 100%;
}
.px-theme .px-btn:hover:not(:disabled) {
    background: var(--px-border);
    color: #fff;
}
.px-theme .px-btn:active:not(:disabled) {
    transform: translate(3px, 3px);
    box-shadow:
        inset -3px -3px 0 0 rgba(0, 0, 0, 0.5),
        inset 3px 3px 0 0 var(--px-border-hi),
        0 0 0 3px var(--px-bg),
        1px 1px 0 0 rgba(0, 0, 0, 0.6);
}
.px-theme .px-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    color: var(--px-text-dim);
}
.px-theme .px-btn.primary {
    background: var(--px-accent);
    color: #000;
    border-color: #8a6a00;
}
.px-theme .px-btn.primary:hover:not(:disabled) { background: #fff; }
.px-theme .px-btn.tall { height: 80px; font-size: 12px; }

/* ============================================================
   移动端触屏按钮
   ============================================================ */
.px-theme .touch-controls {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 360px;
    margin: 12px auto 0;
}
.px-theme .px-touch-btn {
    background: var(--px-panel-2);
    border: 3px solid var(--px-border);
    box-shadow:
        inset -3px -3px 0 0 rgba(0, 0, 0, 0.5),
        inset 3px 3px 0 0 var(--px-border-hi),
        0 0 0 3px var(--px-bg);
    color: var(--px-text);
    height: 56px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    touch-action: manipulation;
}
.px-theme .px-touch-btn:active {
    transform: translate(2px, 2px);
    background: var(--px-border);
}

/* ============================================================
   说明面板
   ============================================================ */
.px-theme .px-help {
    font-size: 8px;
    line-height: 1.8;
    color: var(--px-text-dim);
    letter-spacing: 0.5px;
}
.px-theme .px-help .key {
    color: var(--px-accent);
    background: var(--px-bg);
    padding: 1px 4px;
    border: 1px solid var(--px-border);
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 1023px) {
    .px-theme .tetris-layout {
        flex-wrap: wrap;
        gap: 16px;
    }
}

@media (max-width: 767px) {
    .px-theme.game-inner {
        padding: 8px;
    }
    .px-theme .tetris-layout {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        flex-wrap: nowrap;
    }
    .px-theme .tetris-side {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        gap: 8px;
    }
    .px-theme .tetris-side .px-card {
        flex: 1 1 100px;
        min-width: 100px;
        padding: 8px;
        text-align: center;
    }
    .px-theme .tetris-side .px-card .card-title { font-size: 8px; margin-bottom: 4px; }
    .px-theme .tetris-side .px-card .card-value { font-size: 14px; }
    .px-theme .tetris-side #btnStart { flex: 1 1 100%; }
    .px-theme .tetris-side .px-btn.tall { display: none; }
    .px-theme .tetris-side .px-help { display: none; }
    .px-theme .touch-controls { display: grid; }
    .px-theme #tetris-canvas { width: auto; max-height: 45vh; }
}

/* ============================================================
   像素模态框（只在 .px-theme 的 modal 上生效）
   ============================================================ */
.px-theme .modal-box {
    background: var(--px-panel);
    border: 4px solid var(--px-border);
    box-shadow:
        inset 0 0 0 3px var(--px-bg),
        0 0 0 4px var(--px-bg),
        8px 8px 0 0 rgba(0, 0, 0, 0.6);
    border-radius: 0;
    padding: 32px 40px;
    font-family: "Press Start 2P", "Courier New", monospace;
}
.px-theme .modal-box h2 {
    color: var(--px-accent);
    font-size: 16px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 16px;
}
.px-theme .modal-box p {
    color: var(--px-text-dim);
    font-size: 10px;
    letter-spacing: 1px;
}
.px-theme .modal-box .big-value {
    color: #fff;
    font-size: 28px;
    text-shadow: 3px 3px 0 var(--px-border);
    font-weight: 700;
}
.px-theme .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
}
.px-theme .modal-actions .px-btn { flex: 1; }
</style>
</head>
<body class="embedded">
<!-- 关键：在 game-inner 上加 px-theme 类，把像素风作用域限制在这里 -->
<div class="game-inner px-theme">
    <div class="tetris-layout">
        <div class="tetris-side">
            <div class="px-card" style="text-align:center;">
                <div class="card-title">NEXT</div>
                <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>
            <div class="px-card" style="text-align:center;">
                <div class="card-title">SCORE</div>
                <div class="card-value" id="score">0</div>
            </div>
            <div class="px-card" style="text-align:center;">
                <div class="card-title">LEVEL / BEST</div>
                <div class="card-value" style="font-size:14px;" id="level">1 / 0</div>
            </div>
            <button class="px-btn primary" id="btnStart">START</button>
        </div>

        <canvas id="tetris-canvas" width="240" height="480"></canvas>

        <div class="tetris-side">
            <button class="px-btn tall" id="btnRotate">ROTATE</button>
            <button class="px-btn" id="btnPause" style="height: 44px;">PAUSE</button>
            <div class="px-card">
                <div class="card-title">KEYS</div>
                <div class="px-help">
                    <span class="key">←→</span> MOVE<br>
                    <span class="key">↑</span> ROTATE<br>
                    <span class="key">↓</span> SOFT DROP<br>
                    <span class="key">SPACE</span> HARD DROP<br>
                    <span class="key">P</span> PAUSE
                </div>
            </div>
        </div>
    </div>

    <div class="touch-controls" id="touchControls">
        <button class="px-touch-btn" data-action="left">←</button>
        <button class="px-touch-btn" data-action="rotate">↻</button>
        <button class="px-touch-btn" data-action="right">→</button>
        <button class="px-touch-btn" data-action="down">↓</button>
    </div>
</div>

<!-- 模态框需要在 px-theme 下才能用像素样式，所以在 wrapper 里加 px-theme -->
<div class="modal px-theme" id="modal">
    <div class="modal-box">
        <h2 id="modalTitle">GAME OVER</h2>
        <p id="modalSub">FINAL SCORE<span class="big-value" id="finalScore">0</span></p>
        <div class="modal-actions">
            <button class="px-btn primary" id="btnRestart">RESTART</button>
            <button class="px-btn" id="btnLeave">CLOSE</button>
        </div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script>
(function () {
    'use strict';

    document.body.classList.add('embedded');
    GameBridge.notifyReady();

    const COLS = 10, ROWS = 20, BLOCK = 24;
    const BASE_INTERVAL = 800;
    const MIN_INTERVAL = 100;

    const PIECES = [
        { shape: [[1,1,1,1]], color: '#00e0e0' },
        { shape: [[1,1],[1,1]], color: '#f7d51d' },
        { shape: [[0,1,0],[1,1,1]], color: '#a020f0' },
        { shape: [[0,1,1],[1,1,0]], color: '#00c020' },
        { shape: [[1,1,0],[0,1,1]], color: '#e03030' },
        { shape: [[1,0,0],[1,1,1]], color: '#2060f0' },
        { shape: [[0,0,1],[1,1,1]], color: '#f08000' }
    ];

    let bag = [];
    function nextFromBag() {
        if (bag.length === 0) {
            bag = PIECES.map((_, i) => i);
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
        }
        return PIECES[bag.pop()];
    }

    const canvas = document.getElementById('tetris-canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');
    setupDPR(canvas, ctx, 240, 480);
    setupDPR(nextCanvas, nextCtx, 120, 120);

    function setupDPR(c, context, w, h) {
        const dpr = window.devicePixelRatio || 1;
        c.width = w * dpr;
        c.height = h * dpr;
        c.style.width = w + 'px';
        c.style.height = h + 'px';
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        context.imageSmoothingEnabled = false;
    }

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const btnStart = document.getElementById('btnStart');
    const btnRotate = document.getElementById('btnRotate');
    const btnPause = document.getElementById('btnPause');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const btnRestart = document.getElementById('btnRestart');
    const btnLeave = document.getElementById('btnLeave');
    const touchControls = document.getElementById('touchControls');

    let board, score, level, lines, current, next, dropCounter, lastTime, rafId, state;
    let bestScore = 0;
    try { bestScore = parseInt(localStorage.getItem('tetrisBest') || '0', 10) || 0; } catch (e) {}

    function reset() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        level = 1;
        lines = 0;
        current = null;
        next = null;
        dropCounter = 0;
        lastTime = 0;
        state = 'idle';
        if (rafId) cancelAnimationFrame(rafId);
        scoreEl.textContent = '0';
        updateLevelUI();
        btnStart.textContent = 'START';
        btnStart.disabled = false;
        btnPause.disabled = true;
        modal.classList.remove('show');
        draw();
        drawNext();
    }

    function updateLevelUI() {
        levelEl.textContent = `${level} / ${bestScore}`;
    }

    function dropInterval() {
        return Math.max(MIN_INTERVAL, BASE_INTERVAL - (level - 1) * 60);
    }

    function spawn() {
        current = next || nextFromBag();
        next = nextFromBag();
        drawNext();
        current.x = Math.floor((COLS - current.shape[0].length) / 2);
        current.y = 0;
        if (collide()) endGame();
    }

    function collide(shape, ox, oy) {
        shape = shape || (current && current.shape);
        if (!shape) return false;
        ox = (ox === undefined) ? current.x : ox;
        oy = (oy === undefined) ? current.y : oy;
        for (let y = 0; y < shape.length; y++) {
            for (let x = 0; x < shape[y].length; x++) {
                if (!shape[y][x]) continue;
                const bx = ox + x, by = oy + y;
                if (bx < 0 || bx >= COLS || by >= ROWS) return true;
                if (by >= 0 && board[by][bx]) return true;
            }
        }
        return false;
    }

    function merge() {
        current.shape.forEach((row, y) => {
            row.forEach((v, x) => {
                if (v && current.y + y >= 0) {
                    board[current.y + y][current.x + x] = current.color;
                }
            });
        });
        clearLines();
        spawn();
    }

    function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
            if (board[y].every(v => v !== 0)) {
                board.splice(y, 1);
                board.unshift(Array(COLS).fill(0));
                cleared++;
                y++;
            }
        }
        if (cleared > 0) {
            const points = [0, 100, 300, 500, 800];
            score += points[cleared] * level;
            lines += cleared;
            const newLevel = Math.floor(lines / 10) + 1;
            if (newLevel !== level) level = newLevel;
            scoreEl.textContent = score;
            updateLevelUI();
            if (score > bestScore) {
                bestScore = score;
                try { localStorage.setItem('tetrisBest', String(bestScore)); } catch (e) {}
                updateLevelUI();
            }
        }
    }

    function rotate() {
        if (!current || state !== 'running') return;
        const rotated = current.shape[0].map((_, i) => current.shape.map(r => r[i]).reverse());
        const oldShape = current.shape;
        const kicks = [0, -1, 1, -2, 2];
        for (const dx of kicks) {
            if (!collide(rotated, current.x + dx, current.y)) {
                current.shape = rotated;
                current.x += dx;
                draw();
                return;
            }
        }
        current.shape = oldShape;
    }

    function move(dx) {
        if (!current || state !== 'running') return;
        if (!collide(current.shape, current.x + dx, current.y)) {
            current.x += dx;
            draw();
        }
    }

    function softDrop() {
        if (!current || state !== 'running') return;
        if (!collide(current.shape, current.x, current.y + 1)) {
            current.y++;
        } else {
            merge();
        }
        dropCounter = 0;
        draw();
    }

    function hardDrop() {
        if (!current || state !== 'running') return;
        while (!collide(current.shape, current.x, current.y + 1)) current.y++;
        merge();
        dropCounter = 0;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, 240, 480);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 240, 480);

        ctx.strokeStyle = 'rgba(58, 74, 122, 0.35)';
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * BLOCK + 0.5, 0);
            ctx.lineTo(i * BLOCK + 0.5, 480);
            ctx.stroke();
        }
        for (let i = 1; i < ROWS; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * BLOCK + 0.5);
            ctx.lineTo(240, i * BLOCK + 0.5);
            ctx.stroke();
        }

        board.forEach((row, y) => row.forEach((c, x) => { if (c) drawBlock(x, y, c); }));
        if (current) {
            current.shape.forEach((row, y) => row.forEach((v, x) => {
                if (v) drawBlock(current.x + x, current.y + y, current.color);
            }));
        }
    }

    function drawBlock(x, y, color) {
        const px = x * BLOCK, py = y * BLOCK;
        const S = BLOCK;
        ctx.fillStyle = color;
        ctx.fillRect(px, py, S, S);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fillRect(px, py, S, 3);
        ctx.fillRect(px, py, 3, S);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(px, py + S - 3, S, 3);
        ctx.fillRect(px + S - 3, py, 3, S);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, S - 1, S - 1);
    }

    function drawNext() {
        nextCtx.clearRect(0, 0, 120, 120);
        nextCtx.fillStyle = '#000';
        nextCtx.fillRect(0, 0, 120, 120);
        if (!next) return;
        const shape = next.shape;
        const bs = 24;
        const ox = (120 - shape[0].length * bs) / 2;
        const oy = (120 - shape.length * bs) / 2;
        shape.forEach((row, y) => row.forEach((v, x) => {
            if (!v) return;
            const px = ox + x * bs, py = oy + y * bs;
            nextCtx.fillStyle = next.color;
            nextCtx.fillRect(px, py, bs - 2, bs - 2);
            nextCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            nextCtx.fillRect(px, py, bs - 2, 3);
            nextCtx.fillRect(px, py, 3, bs - 2);
            nextCtx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            nextCtx.fillRect(px, py + bs - 5, bs - 2, 3);
            nextCtx.fillRect(px + bs - 5, py, 3, bs - 2);
            nextCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
            nextCtx.lineWidth = 1;
            nextCtx.strokeRect(px + 0.5, py + 0.5, bs - 3, bs - 3);
        }));
    }

    function loop(time = 0) {
        if (state !== 'running') return;
        if (!lastTime) lastTime = time;
        const dt = time - lastTime;
        lastTime = time;
        dropCounter += dt;
        if (dropCounter > dropInterval()) softDrop();
        draw();
        rafId = requestAnimationFrame(loop);
    }

    function start() {
        reset();
        state = 'running';
        next = nextFromBag();
        spawn();
        lastTime = 0;
        dropCounter = 0;
        rafId = requestAnimationFrame(loop);
        btnStart.textContent = 'RESTART';
        btnPause.disabled = false;
    }

    function pause() {
        if (state === 'running') {
            state = 'paused';
            if (rafId) cancelAnimationFrame(rafId);
            showModal('PAUSED', '点击继续继续游戏', 'RESUME', 'CLOSE');
            btnRestart.onclick = resume;
            btnLeave.onclick = () => { modal.classList.remove('show'); leave(); };
        }
    }
    function resume() {
        if (state !== 'paused') return;
        modal.classList.remove('show');
        state = 'running';
        lastTime = 0;
        dropCounter = 0;
        rafId = requestAnimationFrame(loop);
    }

    function endGame() {
        state = 'over';
        if (rafId) cancelAnimationFrame(rafId);
        showModal('GAME OVER', 'FINAL SCORE', 'RESTART', 'CLOSE', score);
        btnRestart.onclick = start;
        btnLeave.onclick = () => { modal.classList.remove('show'); leave(); };
    }

    function showModal(title, sub, restartText, leaveText, bigValue) {
        modalTitle.textContent = title;
        modalSub.innerHTML = sub + '<span class="big-value" id="finalScore"></span>';
        const el = modalSub.querySelector('#finalScore');
        if (bigValue !== null && bigValue !== undefined) el.textContent = bigValue;
        btnRestart.textContent = restartText;
        btnLeave.textContent = leaveText;
        modal.classList.add('show');
    }

    function leave() {
        modal.classList.remove('show');
        reset();
    }

    btnStart.onclick = start;
    btnRotate.addEventListener('click', rotate);
    btnPause.addEventListener('click', pause);
    btnRestart.addEventListener('click', start);
    btnLeave.addEventListener('click', leave);

    touchControls.addEventListener('click', (e) => {
        const btn = e.target.closest('.px-touch-btn');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'left') move(-1);
        else if (action === 'right') move(1);
        else if (action === 'down') softDrop();
        else if (action === 'rotate') rotate();
    });

    let touchStartX = 0, touchStartY = 0, touchMoved = false;
    canvas.addEventListener('touchstart', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchMoved = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const threshold = 30;
        if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
            move(dx > 0 ? 1 : -1);
            touchStartX = t.clientX;
            touchMoved = true;
        } else if (dy > threshold) {
            softDrop();
            touchStartY = t.clientY;
            touchMoved = true;
        }
    }, { passive: true });
    canvas.addEventListener('touchend', () => {
        if (state !== 'running') return;
        if (!touchMoved) rotate();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            if (state === 'running') pause();
            else if (state === 'paused') resume();
            return;
        }
        if (state !== 'running') return;
        const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '];
        if (keys.includes(e.key)) e.preventDefault();
        if (e.repeat) return;
        switch (e.key) {
            case 'ArrowLeft': move(-1); break;
            case 'ArrowRight': move(1); break;
            case 'ArrowDown': softDrop(); break;
            case 'ArrowUp': rotate(); break;
            case ' ': hardDrop(); break;
        }
    });

    GameBridge.onParentMessage((msg) => {
        if (msg.type === 'pause' && state === 'running') pause();
    });

    GameBridge.onVisibilityChange((hidden) => {
        if (hidden && state === 'running') pause();
    });

    reset();
})();
</script>
</body>
</html>
