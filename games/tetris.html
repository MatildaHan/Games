<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>俄罗斯方块</title>
<link rel="stylesheet" href="../css/common.css">
<style>
/* ---------- 布局：桌面三栏 / 手机单栏 ---------- */
.tetris-layout {
    display: grid;
    grid-template-columns: 160px auto 180px;
    gap: 24px;
    align-items: flex-start;
    width: 100%;
    height: 100%;
    justify-content: center;
}
.tetris-side {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
}

#tetris-canvas {
    display: block;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    max-width: 100%;
    height: auto;
    touch-action: none;
}
#next-canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
}
.btn-rotate {
    height: 68px;
    font-size: 18px;
}

/* 移动端虚拟按键 */
.touch-controls {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
}
.touch-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    border-radius: 10px;
    height: 56px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    font-family: inherit;
}
.touch-btn:active { background: var(--primary-mid); }

/* ---------- 平板 ---------- */
@media (max-width: 1023px) {
    .tetris-layout {
        grid-template-columns: 130px auto 150px;
        gap: 16px;
    }
}

/* ---------- 手机 ---------- */
@media (max-width: 767px) {
    .tetris-layout {
        grid-template-columns: 1fr;
        gap: 12px;
        align-items: center;
        justify-items: center;
    }
    .tetris-side {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        gap: 8px;
    }
    .tetris-side .card {
        flex: 1 1 100px;
        min-width: 100px;
        padding: 8px;
        text-align: center;
    }
    .tetris-side .card .card-title { font-size: 11px; margin-bottom: 4px; }
    .tetris-side .card .card-value { font-size: 18px; }
    .tetris-side .card canvas { width: 70px; height: 70px; }
    .tetris-side #btnStart { flex: 1 1 100%; }
    .tetris-side .btn-rotate { display: none; } /* 手机用虚拟按键 */
    .tetris-side .card:last-child { display: none; } /* 隐藏操作说明 */
    .touch-controls { display: grid; }
    #tetris-canvas {
        width: auto;
        max-height: 45vh;
    }
}
</style>
</head>
<body>
<div class="game-inner">
    <div class="tetris-layout">
        <!-- 左侧 -->
        <div class="tetris-side">
            <div class="card" style="text-align:center;">
                <div class="card-title">下一个</div>
                <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>
            <div class="card" style="text-align:center;">
                <div class="card-title">得分</div>
                <div class="card-value" id="score">0</div>
            </div>
            <button class="btn" id="btnStart">开始游戏</button>
        </div>

        <!-- 中间：主画布 -->
        <canvas id="tetris-canvas" width="240" height="480"></canvas>

        <!-- 右侧 -->
        <div class="tetris-side">
            <button class="btn ghost btn-rotate" id="btnRotate">↻ 旋转</button>
            <div class="card" style="font-size:12px; line-height:1.7; color:var(--text-sub);">
                <div class="card-title">操作</div>
                ← → 移动<br>
                ↑ 旋转<br>
                ↓ 加速<br>
                空格 落底
            </div>
        </div>
    </div>

    <!-- 手机虚拟按键 -->
    <div class="touch-controls" id="touchControls">
        <button class="touch-btn" data-action="left">←</button>
        <button class="touch-btn" data-action="rotate">↻</button>
        <button class="touch-btn" data-action="right">→</button>
        <button class="touch-btn" data-action="down">↓</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-box">
            <h2>游戏结束</h2>
            <p>最终得分<span class="big-value" id="finalScore">0</span></p>
            <div class="modal-actions">
                <button class="btn" id="btnRestart">重新开始</button>
                <button class="btn ghost" id="btnLeave">暂时离开</button>
            </div>
        </div>
    </div>
</div>

<script src="../js/bridge.js"></script>
<script>
(function () {
    'use strict';

    const COLS = 10, ROWS = 20, BLOCK = 24;
    const PIECES = [
        { shape: [[1,1,1,1]], color: '#FDF6E3' },
        { shape: [[1,1],[1,1]], color: '#E6E6FA' },
        { shape: [[0,1,0],[1,1,1]], color: '#F8F9FA' },
        { shape: [[0,1,1],[1,1,0]], color: '#E0F7FA' },
        { shape: [[1,1,0],[0,1,1]], color: '#FCE4EC' },
        { shape: [[1,0,0],[1,1,1]], color: '#E8F5E9' },
        { shape: [[0,0,1],[1,1,1]], color: '#F5F5DC' },
        { shape: [[1,1,1],[0,1,0]], color: '#B2DFDB' },
        { shape: [[1,1,1],[1,0,0]], color: '#FFF8E1' }
    ];

    const canvas = document.getElementById('tetris-canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const btnStart = document.getElementById('btnStart');
    const btnRotate = document.getElementById('btnRotate');
    const modal = document.getElementById('modal');
    const finalScoreEl = document.getElementById('finalScore');
    const btnRestart = document.getElementById('btnRestart');
    const btnLeave = document.getElementById('btnLeave');
    const touchControls = document.getElementById('touchControls');

    let board, score, current, next, dropCounter, lastTime, rafId, state;

    function reset() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        current = null;
        next = null;
        dropCounter = 0;
        lastTime = 0;
        scoreEl.textContent = '0';
        state = 'idle';
        if (rafId) cancelAnimationFrame(rafId);
        btnStart.textContent = '开始游戏';
        btnStart.onclick = start;
        btnStart.disabled = false;
        modal.classList.remove('show');
        draw();
        drawNext();
    }

    function randomPiece() {
        const p = PIECES[Math.floor(Math.random() * PIECES.length)];
        return { shape: p.shape.map(r => r.slice()), color: p.color };
    }

    function spawn() {
        current = next || randomPiece();
        next = randomPiece();
        drawNext();
        current.x = Math.floor((COLS - current.shape[0].length) / 2);
        current.y = 0;
        if (collide()) endGame();
    }

    function collide() {
        if (!current) return false;
        for (let y = 0; y < current.shape.length; y++) {
            for (let x = 0; x < current.shape[y].length; x++) {
                if (!current.shape[y][x]) continue;
                const bx = current.x + x, by = current.y + y;
                if (bx < 0 || bx >= COLS || by >= ROWS) return true;
                if (by >= 0 && board[by][bx]) return true;
            }
        }
        return false;
    }

    function merge() {
        current.shape.forEach((row, y) => {
            row.forEach((v, x) => {
                if (v && current.y + y >= 0) {
                    board[current.y + y][current.x + x] = current.color;
                }
            });
        });
        clearLines();
        spawn();
    }

    function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
            if (board[y].every(v => v !== 0)) {
                board.splice(y, 1);
                board.unshift(Array(COLS).fill(0));
                cleared++;
                y++;
            }
        }
        if (cleared > 0) {
            score += cleared;
            scoreEl.textContent = score;
        }
    }

    function rotate() {
        if (!current || state !== 'running') return;
        const rotated = current.shape[0].map((_, i) => current.shape.map(r => r[i]).reverse());
        const oldShape = current.shape;
        current.shape = rotated;
        if (collide()) current.shape = oldShape;
        draw();
    }

    function move(dx) {
        if (!current || state !== 'running') return;
        current.x += dx;
        if (collide()) current.x -= dx;
        draw();
    }

    function softDrop() {
        if (!current || state !== 'running') return;
        current.y++;
        if (collide()) {
            current.y--;
            merge();
        }
        dropCounter = 0;
        draw();
    }

    function hardDrop() {
        if (!current || state !== 'running') return;
        while (!collide()) current.y++;
        current.y--;
        merge();
        dropCounter = 0;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
            ctx.beginPath(); ctx.moveTo(i * BLOCK, 0); ctx.lineTo(i * BLOCK, canvas.height); ctx.stroke();
        }
        for (let i = 1; i < ROWS; i++) {
            ctx.beginPath(); ctx.moveTo(0, i * BLOCK); ctx.lineTo(canvas.width, i * BLOCK); ctx.stroke();
        }
        board.forEach((row, y) => row.forEach((c, x) => { if (c) drawBlock(x, y, c); }));
        if (current) {
            current.shape.forEach((row, y) => row.forEach((v, x) => {
                if (v) drawBlock(current.x + x, current.y + y, current.color);
            }));
        }
    }

    function drawBlock(x, y, color) {
        const px = x * BLOCK, py = y * BLOCK;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(px + 1, py + 1, BLOCK - 2, BLOCK - 2, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.roundRect(px + 1, py + 1, BLOCK - 2, 4, [4,4,0,0]);
        ctx.fill();
    }

    function drawNext() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (!next) return;
        const shape = next.shape;
        const bs = 24;
        const ox = (nextCanvas.width - shape[0].length * bs) / 2;
        const oy = (nextCanvas.height - shape.length * bs) / 2;
        shape.forEach((row, y) => row.forEach((v, x) => {
            if (!v) return;
            nextCtx.fillStyle = next.color;
            nextCtx.beginPath();
            nextCtx.roundRect(ox + x * bs, oy + y * bs, bs - 2, bs - 2, 4);
            nextCtx.fill();
            nextCtx.strokeStyle = 'rgba(0,0,0,0.12)';
            nextCtx.stroke();
        }));
    }

    function loop(time = 0) {
        if (state !== 'running') return;
        if (!lastTime) lastTime = time;
        const dt = time - lastTime;
        lastTime = time;
        dropCounter += dt;
        if (dropCounter > 800) softDrop();
        draw();
        rafId = requestAnimationFrame(loop);
    }

    function start() {
        reset();
        state = 'running';
        next = randomPiece();
        spawn();
        lastTime = 0;
        dropCounter = 0;
        rafId = requestAnimationFrame(loop);
        btnStart.textContent = '重新开始';
        modal.classList.remove('show');
    }

    function endGame() {
        state = 'over';
        if (rafId) cancelAnimationFrame(rafId);
        finalScoreEl.textContent = score;
        modal.classList.add('show');
    }

    function leave() {
        modal.classList.remove('show');
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        scoreEl.textContent = '0';
        current = null;
        next = null;
        if (rafId) cancelAnimationFrame(rafId);
        state = 'idle';
        btnStart.textContent = '开始游戏';
        btnStart.onclick = start;
        btnStart.disabled = false;
        draw();
        drawNext();
    }

    // 事件绑定
    btnStart.onclick = start;
    btnRotate.addEventListener('click', rotate);
    btnRestart.addEventListener('click', start);
    btnLeave.addEventListener('click', leave);

    // 手机虚拟按键
    touchControls.addEventListener('click', (e) => {
        const btn = e.target.closest('.touch-btn');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'left') move(-1);
        else if (action === 'right') move(1);
        else if (action === 'down') softDrop();
        else if (action === 'rotate') rotate();
    });

    // 手机滑动手势（在画布上）
    let touchStartX = 0, touchStartY = 0, touchMoved = false;
    canvas.addEventListener('touchstart', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchMoved = false;
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
        if (state !== 'running') return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const threshold = 30;
        if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
            move(dx > 0 ? 1 : -1);
            touchStartX = t.clientX;
            touchMoved = true;
        } else if (dy > threshold) {
            softDrop();
            touchStartY = t.clientY;
            touchMoved = true;
        }
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
        if (state !== 'running') return;
        // 点击（无滑动）→ 旋转
        if (!touchMoved) rotate();
    });

    document.addEventListener('keydown', e => {
        if (state !== 'running') return;
        const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '];
        if (keys.includes(e.key)) e.preventDefault();
        switch (e.key) {
            case 'ArrowLeft': move(-1); break;
            case 'ArrowRight': move(1); break;
            case 'ArrowDown': softDrop(); break;
            case 'ArrowUp': rotate(); break;
            case ' ': hardDrop(); break;
        }
    });

    GameBridge.onParentMessage((msg) => {
        if (msg.type === 'pause' && state === 'running') {
            state = 'paused';
            if (rafId) cancelAnimationFrame(rafId);
            btnStart.textContent = '继续';
            btnStart.onclick = () => {
                if (state !== 'paused') return;
                state = 'running';
                lastTime = 0;
                dropCounter = 0;
                rafId = requestAnimationFrame(loop);
                btnStart.textContent = '重新开始';
                btnStart.onclick = start;
            };
        }
    });

    reset();
    GameBridge.notifyReady();
})();
</script>
</body>
</html>
